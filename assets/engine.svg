<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc" aria-label="Zero Slop uses eight editorial responsibilities in one workflow. Local tools score the draft and protect source details. The user's AI assistant interprets, rewrites, copy edits, reads the text aloud, and gives it a first-reader polish. The installed skill can isolate those jobs; the free web editor combines them in one model response. Local checks inspect the exact result. A final change gets one local recheck and never restarts the model. Later writer edits can improve private writing rules after safety checks. A separate release review tests quality, safety, speed, and cost. No neural training occurs automatically.">
  <title id="title">How Zero Slop works: eight editorial roles, private learning, and release review</title>
  <desc id="desc">Zero Slop is a skill, not an AI model. Eight editorial responsibilities move one draft through the workflow. Local tools act as scorer, fact gate, and final verifier. The user's existing AI assistant, powered by Claude, GPT, or another compatible model, handles interpretation, rewriting, copy editing, read-aloud editing, and fresh-eyes polish. An installed assistant can isolate those jobs. The free web editor combines them in one model response and makes at most one live model call. Any final change gets one local score and fact recheck; it does not restart the AI pipeline. The private learning loop compares the version returned by the assistant with the version the writer kept, reviews repeated changes for safety, saves approved rules privately, and reuses only relevant past fixes. A separate release review tests quality, safety, speed, and cost; it never edits a user's draft. No neural training occurs automatically.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#718078"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A56625"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#72528F"/></marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17221C" flood-opacity=".07"/></filter>
    <style>
      .grt{fill:#F5F7F3}.grp{fill:#FBFCF9;stroke:#D2D9D2;stroke-width:1.3}.grl{fill:#F0F3F0;stroke:#AAB4AC}.node{fill:#FFF;stroke:#D4DBD4;stroke-width:1.2}.green{fill:#E8F2EC;stroke:#227B5B}.olive{fill:#EFF3E8;stroke:#71804B}.amber{fill:#F7EFE3;stroke:#A56625}.purple{fill:#F2EDF6;stroke:#72528F}.slate{fill:#F0F3F0;stroke:#AAB4AC}.output{fill:#173D30;stroke:#173D30}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17201B}.dek{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5E6A63}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;fill:#597067}.eyebrowPurple{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;fill:#72528F}.eyebrowAmber{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;fill:#8B571D}.stage{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17201B}.role{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.1px;fill:#6B776F}.body{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526058}.small{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#66736B}.smallStrong{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#35433B}.whiteLabel{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.1px;fill:#CDE1D7}.ln{fill:none;stroke:#718078;stroke-width:1.6}.rp{fill:none;stroke:#A56625;stroke-width:1.7;stroke-dasharray:6 5}.lp{fill:none;stroke:#72528F;stroke-width:1.7;stroke-dasharray:6 5}.rail{fill:none;stroke:#D4DBD4;stroke-width:1.2}.badge{fill:#FFF;stroke:#CED6CF;stroke-width:1}.badgeText{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px;fill:#56645C}.purpleText{fill:#72528F}.amberText{fill:#8B571D}
      @media (prefers-reduced-motion:reduce){.motion{display:none}}
      @media (prefers-color-scheme:dark){#background{fill:#101512}.grt{fill:#101512}.grp{fill:#171D18;stroke:#374139}.grl{fill:#1D231E;stroke:#4C574F}.node{fill:#1C231E;stroke:#3B463E}.green{fill:#142A21;stroke:#42A57B}.olive{fill:#242A1B;stroke:#94A561}.amber{fill:#302316;stroke:#C58A43}.purple{fill:#251D2B;stroke:#9D78B7}.slate{fill:#1D231E;stroke:#4C574F}.title,.stage{fill:#EEF3EF}.dek,.body,.small{fill:#AEB9B1}.eyebrow,.role,.badgeText{fill:#9EACA3}.smallStrong{fill:#D7DFD9}.badge{fill:#202721;stroke:#465149}.ln{stroke:#7D8A81}.rp{stroke:#C58A43}.lp{stroke:#9D78B7}.amberText{fill:#D4A05F}.purpleText{fill:#B899CC}}
    </style>
  </defs>

  <rect id="background" width="1600" height="1040" class="grt"/>
  <text x="48" y="56" class="title">Eight roles. One editing workflow.</text>
  <text x="48" y="84" class="dek">Your AI assistant handles context and editing. Local tools measure the writing and protect the source. The web editor uses one model call.</text>

  <rect x="40" y="116" width="1520" height="440" rx="22" class="grp" filter="url(#softShadow)"/>
  <text x="70" y="154" class="eyebrow">LOOP 1 · EDITING WORKFLOW · EIGHT ROLES</text><text x="70" y="178" class="dek">Four roles understand and rewrite. Four more finish, verify, and approve the exact text the reader will see.</text>
  <path d="M72 190H1538" class="rail"/><circle r="4.5" fill="#227B5B" class="motion"><animateMotion dur="9s" repeatCount="indefinite" path="M72 190H1538"/></circle>

  <rect x="72" y="206" width="340" height="116" rx="14" class="node green"/><text x="92" y="236" class="stage">1 · Scorer</text><text x="92" y="257" class="role">LOCAL TOOLS</text><text x="92" y="283" class="body">flagged phrases · writing score</text><text x="92" y="304" class="small">rhythm · clarity · formatting</text>
  <path d="M412 264H444" class="ln" marker-end="url(#arrow)"/>
  <rect x="444" y="206" width="340" height="116" rx="14" class="node olive"/><text x="464" y="236" class="stage">2 · Interpreter</text><text x="464" y="257" class="role">YOUR AI ASSISTANT</text><text x="464" y="283" class="body">claims · purpose · voice</text><text x="464" y="304" class="small">structure and performed register</text>
  <path d="M784 264H816" class="ln" marker-end="url(#arrow)"/>
  <rect x="816" y="206" width="340" height="116" rx="14" class="node olive"/><text x="836" y="236" class="stage">3 · Rewriter</text><text x="836" y="257" class="role">YOUR AI ASSISTANT</text><text x="836" y="283" class="body">remove stock wording</text><text x="836" y="304" class="small">rebuild order · rhythm · tone</text>
  <path d="M1156 264H1188" class="ln" marker-end="url(#arrow)"/>
  <rect x="1188" y="206" width="340" height="116" rx="14" class="node green"/><text x="1208" y="236" class="stage">4 · Fact gate</text><text x="1208" y="257" class="role">LOCAL TOOLS</text><text x="1208" y="283" class="body">names · figures · links</text><text x="1208" y="304" class="small">code · tables · structure</text>

  <path d="M1358 322V343H52V430H72" class="ln" marker-end="url(#arrow)"/><text x="620" y="338" class="small">installed: role-isolated work · web: one shared AI response</text>
  <rect x="72" y="372" width="340" height="116" rx="14" class="node"/><text x="92" y="402" class="stage">5 · Copy desk</text><text x="92" y="423" class="role">YOUR AI ASSISTANT</text><text x="92" y="449" class="body">grammar · spelling · usage</text><text x="92" y="470" class="small">correct the deliverable itself</text>
  <path d="M412 430H444" class="ln" marker-end="url(#arrow)"/>
  <rect x="444" y="372" width="340" height="116" rx="14" class="node"/><text x="464" y="402" class="stage">6 · Read aloud</text><text x="464" y="423" class="role">YOUR AI ASSISTANT</text><text x="464" y="449" class="body">flow · transitions · repetition</text><text x="464" y="470" class="small">fix every safe stumble</text>
  <path d="M784 430H816" class="ln" marker-end="url(#arrow)"/>
  <rect x="816" y="372" width="340" height="116" rx="14" class="node amber"/><text x="836" y="402" class="stage">7 · Verifier</text><text x="836" y="423" class="role">LOCAL CHECKS + AI CONTEXT</text><text x="836" y="449" class="body">score · facts · meaning</text><text x="836" y="470" class="small">voice · format · structure</text>
  <path d="M1156 430H1188" class="ln" marker-end="url(#arrow)"/>
  <rect x="1188" y="372" width="340" height="116" rx="14" class="node purple"/><text x="1208" y="402" class="stage">8 · Fresh eyes</text><text x="1208" y="423" class="role">YOUR AI ASSISTANT</text><text x="1208" y="449" class="body">read as a first-time reader</text><text x="1208" y="470" class="small">apply only safe final polish</text>
  <path d="M1358 488V503H1542V264H1528" class="rp" marker-end="url(#amberArrow)"/><text x="585" y="508" class="small amberText">final polish → one local score + fact recheck · no model restart</text>
  <rect x="1188" y="514" width="340" height="28" rx="14" class="output"/><text x="1358" y="533" text-anchor="middle" class="whiteLabel">SAFEST EDIT · ANY WARNING NAMED</text>

  <rect x="40" y="586" width="980" height="414" rx="22" class="grp"/>
  <text x="70" y="624" class="eyebrowPurple">LOOP 2 · LEARN FROM THE WRITER</text><text x="70" y="648" class="dek">Later edits can improve private writing rules. Nothing retrains the AI or edits the skill.</text>
  <rect x="70" y="686" width="170" height="142" rx="14" class="node purple"/><text x="88" y="716" class="stage">1 · Compare</text><text x="88" y="737" class="role">RETURNED ↔ KEPT</text><text x="88" y="765" class="body">cuts + replacements</text><text x="88" y="786" class="body">kept flagged phrases</text><text x="88" y="807" class="small">one pair = one vote</text>
  <path d="M240 757H256" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="256" y="686" width="170" height="142" rx="14" class="node purple"/><text x="274" y="716" class="stage">2 · Protect</text><text x="274" y="737" class="role">LOCKED TO SOURCE</text><text x="274" y="765" class="body">exact before / after</text><text x="274" y="786" class="small">phrase · reason</text><text x="274" y="807" class="small">mismatch → reject</text>
  <path d="M426 757H442" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="442" y="686" width="170" height="142" rx="14" class="node purple"/><text x="460" y="716" class="stage">3 · Review</text><text x="460" y="737" class="role">SAFETY GATES</text><text x="460" y="765" class="body">seen in 3 or 5 edits</text><text x="460" y="786" class="body">safe on human text</text><text x="460" y="807" class="small">one edit ≠ enough</text>
  <path d="M612 757H628" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="628" y="686" width="170" height="142" rx="14" class="node purple"/><text x="646" y="716" class="stage">4 · Save</text><text x="646" y="737" class="role">LOCAL FILE</text><text x="646" y="765" class="body">phrases + strength</text><text x="646" y="786" class="body">fixes + dates</text><text x="646" y="807" class="small">private · reversible</text>
  <path d="M798 757H814" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="814" y="686" width="170" height="142" rx="14" class="node purple"/><text x="832" y="716" class="stage">5 · Reuse</text><text x="832" y="737" class="role">NEXT DRAFT</text><text x="832" y="765" class="body">helpful past fixes</text><text x="832" y="786" class="body">confirm or retire</text><text x="832" y="807" class="small">no match → ignore</text>
  <path d="M182 686V666H169V556" class="lp" marker-end="url(#purpleArrow)"/><text x="122" y="660" class="small purpleText">private rules → Scorer</text>
  <path d="M899 686V658H986V556" class="lp" marker-end="url(#purpleArrow)"/><text x="768" y="652" class="small purpleText">past fixes → Rewriter</text>
  <path d="M70 848H984" class="rail"/><circle r="4.5" fill="#72528F" class="motion"><animateMotion dur="6s" repeatCount="indefinite" path="M70 848H984"/></circle>
  <rect x="70" y="874" width="914" height="84" rx="13" class="grl"/><text x="92" y="903" class="smallStrong">Built-in protections</text><text x="92" y="926" class="body">3 separate edits for a phrase · 5 for one word · 18-month retirement · private by default</text><rect x="764" y="890" width="194" height="30" rx="15" class="badge"/><text x="861" y="910" text-anchor="middle" class="badgeText">NO NEURAL TRAINING</text>

  <rect x="1044" y="586" width="516" height="414" rx="22" class="grp"/>
  <text x="1074" y="624" class="eyebrowAmber">SEPARATE RELEASE REVIEW</text><text x="1074" y="648" class="dek">Tests proposed changes; never edits a user's draft.</text>
  <rect x="1074" y="686" width="210" height="108" rx="14" class="node slate"/><text x="1092" y="716" class="stage">Choose test sets</text><text x="1092" y="737" class="role">LABELS · SOURCE</text><text x="1092" y="765" class="body">match set to question</text><text x="1092" y="784" class="small">keep source groups apart</text>
  <path d="M1284 740H1304" class="ln" marker-end="url(#arrow)"/>
  <rect x="1304" y="686" width="226" height="108" rx="14" class="node slate"/><text x="1322" y="716" class="stage">Independent review</text><text x="1322" y="737" class="role">TOOL NAME HIDDEN</text><text x="1322" y="765" class="body">AI and human review</text><text x="1322" y="784" class="small">keep disagreements</text>
  <path d="M1417 794V814" class="ln" marker-end="url(#arrow)"/>
  <rect x="1074" y="814" width="456" height="90" rx="14" class="node amber"/><text x="1094" y="844" class="stage">Quality · safety · speed · cost</text><text x="1094" y="867" class="body">Compare versions on the same reserved material.</text><text x="1094" y="888" class="small">Report uncertainty, group results, and unanswered items.</text>
  <rect x="1074" y="926" width="456" height="36" rx="18" class="amber"/><text x="1302" y="949" text-anchor="middle" class="badgeText amberText">PEOPLE CONFIRM THE GAIN → REVIEWED UPDATE</text>
</svg>
