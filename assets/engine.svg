<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc" aria-label="Zero Slop uses seven roles in one editing workflow. Local tools score the draft. The user's existing AI assistant, powered by Claude, GPT, or another compatible model, interprets and rewrites it. Local tools protect names, numbers, quotations, and links. Fresh AI passes copy edit and read the text aloud. Local tools and the AI assistant verify the exact final text. Later writer edits can improve private writing rules after strict safety checks. A separate release review tests quality, safety, speed, and cost. No neural training occurs automatically.">
  <title id="title">How Zero Slop works: seven editorial roles, one private learning loop, and a separate release review</title>
  <desc id="desc">Zero Slop is a skill, not an AI model. Seven roles move one draft through the editing workflow. Local tools act as scorer and fact gate. The user's existing AI assistant acts as interpreter, rewriter, copy desk, and read-aloud editor. Local tools and the assistant share the verifier role. These are separate responsibilities, not seven models. Any repair repeats the copy desk, read-aloud pass, and every final check. The private learning loop compares the version returned by the assistant with the version the writer kept, reviews repeated changes for safety, saves approved rules privately, and reuses only helpful past fixes. A separate release review tests quality, safety, speed, and cost; it never edits a user's draft. No neural training occurs automatically.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#718078"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A56625"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#72528F"/></marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17221C" flood-opacity=".07"/></filter>
    <style>
      .grt{fill:#F5F7F3}.grp{fill:#FBFCF9;stroke:#D2D9D2;stroke-width:1.3}.grl{fill:#F0F3F0;stroke:#AAB4AC}.node{fill:#FFFFFF;stroke:#D4DBD4;stroke-width:1.2}.green{fill:#E8F2EC;stroke:#227B5B}.olive{fill:#EFF3E8;stroke:#71804B}.amber{fill:#F7EFE3;stroke:#A56625}.purple{fill:#F2EDF6;stroke:#72528F}.slate{fill:#F0F3F0;stroke:#AAB4AC}.output{fill:#173D30;stroke:#173D30}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:34px;fill:#17201B}.dek{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;fill:#5E6A63}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1.6px;fill:#597067}.eyebrowPurple{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1.6px;fill:#72528F}.eyebrowAmber{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1.6px;fill:#8B571D}.stage{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;fill:#17201B}.role{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:1.1px;fill:#6B776F}.body{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;fill:#526058}.small{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;fill:#66736B}.smallStrong{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;fill:#35433B}.whiteLabel{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:1.1px;fill:#CDE1D7}.ln{fill:none;stroke:#718078;stroke-width:1.6}.rp{fill:none;stroke:#A56625;stroke-width:1.7;stroke-dasharray:6 5}.lp{fill:none;stroke:#72528F;stroke-width:1.7;stroke-dasharray:6 5}.badge{fill:#FFFFFF;stroke:#CED6CF;stroke-width:1}.badgeText{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.8px;fill:#56645C}.purpleText{fill:#72528F}.amberText{fill:#8B571D}
      @media (prefers-color-scheme:dark){#background{fill:#101512}.grt{fill:#101512}.grp{fill:#171D18;stroke:#374139}.grl{fill:#1D231E;stroke:#4C574F}.node{fill:#1C231E;stroke:#3B463E}.green{fill:#142A21;stroke:#42A57B}.olive{fill:#242A1B;stroke:#94A561}.amber{fill:#302316;stroke:#C58A43}.purple{fill:#251D2B;stroke:#9D78B7}.slate{fill:#1D231E;stroke:#4C574F}.title,.stage{fill:#EEF3EF}.dek,.body,.small{fill:#AEB9B1}.eyebrow,.role,.badgeText{fill:#9EACA3}.smallStrong{fill:#D7DFD9}.badge{fill:#202721;stroke:#465149}.ln{stroke:#7D8A81}.rp{stroke:#C58A43}.lp{stroke:#9D78B7}.amberText{fill:#D4A05F}.purpleText{fill:#B899CC}}
    </style>
  </defs>

  <rect id="background" width="1600" height="900" class="grt"/>
  <text x="48" y="56" class="title">Seven roles. One editing workflow.</text>
  <text x="48" y="84" class="dek">Your AI assistant handles context and editing. Local tools measure the writing and protect facts. Each role has one job.</text>

  <rect x="40" y="116" width="1520" height="308" rx="22" class="grp" filter="url(#softShadow)"/>
  <text x="70" y="154" class="eyebrow">LOOP 1 · EDITING WORKFLOW · SEVEN ROLES</text><text x="70" y="178" class="dek">The roles move one draft from its first check to verified final text.</text>
  <rect x="72" y="202" width="194" height="126" rx="14" class="node green"/><text x="88" y="232" class="stage">1 · Scorer</text><text x="88" y="253" class="role">LOCAL TOOLS</text><text x="88" y="281" class="body">phrases + writing score</text><text x="88" y="302" class="body">rhythm · clarity</text><text x="88" y="322" class="small">repeatable and offline</text>
  <path d="M266 265H284" class="ln" marker-end="url(#arrow)"/>
  <rect x="284" y="202" width="194" height="126" rx="14" class="node olive"/><text x="300" y="232" class="stage">2 · Interpreter</text><text x="300" y="253" class="role">YOUR AI ASSISTANT</text><text x="300" y="281" class="body">claims · purpose</text><text x="300" y="302" class="body">voice · structure</text><text x="300" y="322" class="small">read before changing</text>
  <path d="M478 265H496" class="ln" marker-end="url(#arrow)"/>
  <rect x="496" y="202" width="194" height="126" rx="14" class="node olive"/><text x="512" y="232" class="stage">3 · Rewriter</text><text x="512" y="253" class="role">YOUR AI ASSISTANT</text><text x="512" y="281" class="body">remove stock wording</text><text x="512" y="302" class="body">order · rhythm · tone</text><text x="512" y="322" class="small">keep the author's meaning</text>
  <path d="M690 265H708" class="ln" marker-end="url(#arrow)"/>
  <rect x="708" y="202" width="194" height="126" rx="14" class="node green"/><text x="724" y="232" class="stage">4 · Fact gate</text><text x="724" y="253" class="role">LOCAL TOOLS</text><text x="724" y="281" class="body">names · figures</text><text x="724" y="302" class="body">quotes · links</text><text x="724" y="322" class="small">reject altered facts</text>
  <path d="M902 265H920" class="ln" marker-end="url(#arrow)"/>
  <rect x="920" y="202" width="194" height="126" rx="14" class="node"/><text x="936" y="232" class="stage">5 · Copy desk</text><text x="936" y="253" class="role">YOUR AI · FRESH PASS</text><text x="936" y="281" class="body">grammar · spelling</text><text x="936" y="302" class="body">usage · consistency</text><text x="936" y="322" class="small">edit the text itself</text>
  <path d="M1114 265H1132" class="ln" marker-end="url(#arrow)"/>
  <rect x="1132" y="202" width="194" height="126" rx="14" class="node"/><text x="1148" y="232" class="stage">6 · Read aloud</text><text x="1148" y="253" class="role">YOUR AI · FRESH PASS</text><text x="1148" y="281" class="body">flow · transitions</text><text x="1148" y="302" class="body">repetition · tone</text><text x="1148" y="322" class="small">fix every safe stumble</text>
  <path d="M1326 265H1344" class="ln" marker-end="url(#arrow)"/>
  <rect x="1344" y="202" width="194" height="126" rx="14" class="node amber"/><text x="1360" y="232" class="stage">7 · Verifier</text><text x="1360" y="253" class="role">LOCAL TOOLS + YOUR AI</text><text x="1360" y="281" class="body">score · facts · meaning</text><text x="1360" y="302" class="body">voice · format</text><text x="1360" y="322" class="small">check the finished text</text>
  <path d="M1441 328V364H1017V329" class="rp" marker-end="url(#amberArrow)"/><text x="1080" y="357" class="small amberText">any repair → copy desk → read aloud → all checks again</text>
  <rect x="1344" y="371" width="194" height="30" rx="15" class="output"/><text x="1441" y="391" text-anchor="middle" class="whiteLabel">FINAL TEXT · READY</text>

  <rect x="40" y="454" width="980" height="406" rx="22" class="grp"/>
  <text x="70" y="492" class="eyebrowPurple">LOOP 2 · LEARN FROM THE WRITER</text><text x="70" y="516" class="dek">Later edits can improve private writing rules. Nothing retrains the AI or edits the skill.</text>
  <rect x="70" y="558" width="170" height="142" rx="14" class="node purple"/><text x="88" y="588" class="stage">1 · Compare</text><text x="88" y="609" class="role">RETURNED ↔ KEPT</text><text x="88" y="637" class="body">cuts + replacements</text><text x="88" y="658" class="body">kept flagged phrases</text><text x="88" y="679" class="small">one pair = one vote</text>
  <path d="M240 629H256" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="256" y="558" width="170" height="142" rx="14" class="node purple"/><text x="274" y="588" class="stage">2 · Protect</text><text x="274" y="609" class="role">LOCKED TO SOURCE</text><text x="274" y="637" class="body">exact before / after</text><text x="274" y="658" class="small">phrase · reason · type</text><text x="274" y="679" class="small">mismatch → reject</text>
  <path d="M426 629H442" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="442" y="558" width="170" height="142" rx="14" class="node purple"/><text x="460" y="588" class="stage">3 · Review</text><text x="460" y="609" class="role">STRICT SAFETY CHECKS</text><text x="460" y="637" class="body">seen in 3 or 5 edits</text><text x="460" y="658" class="body">safe on human text</text><text x="460" y="679" class="small">one edit isn't enough</text>
  <path d="M612 629H628" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="628" y="558" width="170" height="142" rx="14" class="node purple"/><text x="646" y="588" class="stage">4 · Save</text><text x="646" y="609" class="role">LOCAL FILE</text><text x="646" y="637" class="body">phrases + strength</text><text x="646" y="658" class="body">fixes + dates</text><text x="646" y="679" class="small">private · reversible</text>
  <path d="M798 629H814" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="814" y="558" width="170" height="142" rx="14" class="node purple"/><text x="832" y="588" class="stage">5 · Reuse</text><text x="832" y="609" class="role">NEXT DRAFT</text><text x="832" y="637" class="body">helpful past fixes</text><text x="832" y="658" class="body">confirm or retire</text><text x="832" y="679" class="small">no match → ignore</text>
  <path d="M182 558V538H169V424" class="lp" marker-end="url(#purpleArrow)"/><text x="122" y="532" class="small purpleText">private writing rules → Scorer</text>
  <path d="M899 558V530H593V424" class="lp" marker-end="url(#purpleArrow)"/><text x="666" y="524" class="small purpleText">helpful past fixes → Rewriter</text>
  <rect x="70" y="746" width="914" height="72" rx="13" class="grl"/><text x="92" y="773" class="smallStrong">Built-in protections</text><text x="92" y="796" class="body">3 separate edits for a phrase · 5 for a single word · 18-month retirement · private by default</text><rect x="764" y="763" width="194" height="30" rx="15" class="badge"/><text x="861" y="783" text-anchor="middle" class="badgeText">NO NEURAL TRAINING</text>

  <rect x="1044" y="454" width="516" height="406" rx="22" class="grp"/>
  <text x="1074" y="492" class="eyebrowAmber">SEPARATE RELEASE REVIEW</text><text x="1074" y="516" class="dek">Tests proposed changes; never edits a user's draft.</text>
  <rect x="1074" y="558" width="210" height="108" rx="14" class="node slate"/><text x="1092" y="588" class="stage">Choose test sets</text><text x="1092" y="609" class="role">LABELS · TERMS · SOURCE</text><text x="1092" y="637" class="body">match set to question</text><text x="1092" y="656" class="small">keep source groups apart</text>
  <path d="M1284 612H1304" class="ln" marker-end="url(#arrow)"/>
  <rect x="1304" y="558" width="226" height="108" rx="14" class="node slate"/><text x="1322" y="588" class="stage">Independent review</text><text x="1322" y="609" class="role">TOOL NAME HIDDEN</text><text x="1322" y="637" class="body">AI and human review</text><text x="1322" y="656" class="small">keep disagreements</text>
  <path d="M1417 666V686" class="ln" marker-end="url(#arrow)"/>
  <rect x="1074" y="686" width="456" height="90" rx="14" class="node amber"/><text x="1094" y="716" class="stage">Quality · safety · speed · cost</text><text x="1094" y="739" class="body">Compare versions on the same reserved material.</text><text x="1094" y="760" class="small">Report uncertainty, group results, and unanswered items.</text>
  <rect x="1074" y="798" width="456" height="36" rx="18" class="amber"/><text x="1302" y="821" text-anchor="middle" class="badgeText amberText">PEOPLE CONFIRM THE GAIN → REVIEWED UPDATE</text>
</svg>
