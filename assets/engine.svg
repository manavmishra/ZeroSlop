<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Zero Slop engine. A draft is measured by three interpretable channels: a pattern meter of 68 weighted tells with a 54-term lexicon and 13 context-gated riders, rhythm covering burstiness, uniformity and shape, and followability covering density, dashes and register. Evidence fusion produces an AI-likelihood score from 0 to 100 in which every point traces to a quoted span. Diagnose finds hollow spans, inventories facts and marks the author voice. A two-pass rewrite strips the tells then rebuilds toward an expert register. A verify gate either passes, emitting the rewritten text with a scorecard, or fails and loops back to the rewrite up to three times. Below that runs the reflect loop. When you publish an edited version, a span you cut becomes a candidate tell and a flagged span you kept becomes false-positive evidence. Neither changes anything until three gates pass: three independent documents agree, the span is not already caught, and it clears the corpus of certified human writing. Surviving evidence is written to learned.json, raising patterns, lowering weights and letting stale tells decay, which sharpens the pattern meter on the next run.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A939F"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A4FA3"/>
    </marker>
    <style>
      .s  { fill:#F7F8FA; stroke:#C9CED6; stroke-width:1.2 }
      .ch { fill:#EEF3FA; stroke:#2A78D6; stroke-width:1.2 }
      .hi { fill:#E8F3EC; stroke:#1E7A4C; stroke-width:1.4 }
      .lr { fill:#F4EEF8; stroke:#8A4FA3; stroke-width:1.2 }
      .t  { font-size:12px; fill:#1B1D22 }
      .m  { font-size:10px; fill:#5B6270 }
      .h  { font-size:10.5px; fill:#5B6270; letter-spacing:.06em }
      .hp { font-size:10.5px; fill:#8A4FA3; letter-spacing:.06em }
      .lb { font-size:9.5px; fill:#8A4FA3 }
      .ln { stroke:#8A939F; stroke-width:1.3; fill:none }
      .lp { stroke:#8A4FA3; stroke-width:1.3; fill:none; stroke-dasharray:4 3 }
      .grp{ fill:none; stroke:#C9CED6; stroke-width:1; stroke-dasharray:3 3 }
      .grl{ fill:none; stroke:#8A4FA3; stroke-width:1; stroke-dasharray:3 3 }
      @media (prefers-color-scheme: dark) {
        .s  { fill:#1E2128; stroke:#3A404B }
        .ch { fill:#16233A; stroke:#4B90E2 }
        .hi { fill:#14291D; stroke:#3FA872 }
        .lr { fill:#241B2E; stroke:#A972C4 }
        .t  { fill:#E8EAED }
        .m  { fill:#9AA2AE }
        .h  { fill:#9AA2AE }
        .hp { fill:#A972C4 }
        .lb { fill:#A972C4 }
        .ln { stroke:#6B7280 }
        .grp{ stroke:#3A404B }
      }
    </style>
  </defs>

  <text x="16" y="20" class="h">MEASURE · every channel, every run</text>
  <rect x="14" y="28" width="300" height="152" rx="8" class="grp"/>

  <rect x="26" y="40" width="276" height="40" rx="6" class="ch"/>
  <text x="38" y="58" class="t">Pattern meter</text>
  <text x="38" y="72" class="m">68 tells · 54 lexicon · 13 riders</text>

  <rect x="26" y="86" width="276" height="40" rx="6" class="ch"/>
  <text x="38" y="104" class="t">Rhythm</text>
  <text x="38" y="118" class="m">burstiness · uniformity · shape</text>

  <rect x="26" y="132" width="276" height="40" rx="6" class="ch"/>
  <text x="38" y="150" class="t">Followability + format</text>
  <text x="38" y="164" class="m">density · dashes · register</text>

  <rect x="14" y="200" width="92" height="42" rx="6" class="s"/>
  <text x="26" y="226" class="t">Draft</text>
  <path d="M60 200 L60 183" class="ln" marker-end="url(#a)"/>

  <path d="M314 104 L342 104" class="ln" marker-end="url(#a)"/>

  <rect x="344" y="82" width="196" height="44" rx="6" class="s"/>
  <text x="356" y="101" class="t">Evidence fusion</text>
  <text x="356" y="115" class="m">0–100, every point traceable</text>

  <path d="M442 126 L442 152" class="ln" marker-end="url(#a)"/>
  <rect x="344" y="154" width="196" height="44" rx="6" class="s"/>
  <text x="356" y="173" class="t">Diagnose</text>
  <text x="356" y="187" class="m">hollow spans · facts · voice</text>

  <path d="M442 198 L442 226" class="ln" marker-end="url(#a)"/>
  <rect x="344" y="228" width="196" height="44" rx="6" class="s"/>
  <text x="356" y="247" class="t">Two-pass rewrite</text>
  <text x="356" y="261" class="m">strip, then build</text>

  <path d="M540 250 L570 250" class="ln" marker-end="url(#a)"/>
  <rect x="572" y="228" width="156" height="44" rx="6" class="hi"/>
  <text x="584" y="247" class="t">Verify gate</text>
  <text x="584" y="261" class="m">fail → retry, up to 3×</text>

  <path d="M650 272 L650 294 L442 294 L442 275" class="ln" marker-end="url(#a)"/>
  <text x="528" y="290" class="m">fail</text>

  <path d="M728 250 L746 250" class="ln" marker-end="url(#a)"/>
  <rect x="748" y="228" width="124" height="44" rx="6" class="hi"/>
  <text x="760" y="247" class="t">Rewritten text</text>
  <text x="760" y="261" class="m">+ scorecard</text>

  <text x="16" y="318" class="hp">REFLECT · what you changed teaches the meter</text>
  <rect x="14" y="326" width="852" height="92" rx="8" class="grl"/>

  <path d="M810 272 L810 306 L718 306 L718 343" class="lp" marker-end="url(#b)"/>
  <text x="592" y="302" class="lb">you publish an edited version</text>

  <rect x="584" y="346" width="268" height="58" rx="6" class="lr"/>
  <text x="596" y="366" class="t">Your edit</text>
  <text x="596" y="380" class="m">cut a span → candidate tell</text>
  <text x="596" y="394" class="m">kept a flagged one → false positive</text>

  <path d="M584 375 L546 375" class="lp" marker-end="url(#b)"/>
  <rect x="300" y="346" width="244" height="58" rx="6" class="lr"/>
  <text x="312" y="366" class="t">Three gates</text>
  <text x="312" y="380" class="m">3 documents agree · not already</text>
  <text x="312" y="394" class="m">caught · clears the human corpus</text>

  <path d="M300 375 L262 375" class="lp" marker-end="url(#b)"/>
  <rect x="20" y="346" width="240" height="58" rx="6" class="lr"/>
  <text x="32" y="366" class="t">learned.json</text>
  <text x="32" y="380" class="m">patterns up, weights down,</text>
  <text x="32" y="394" class="m">stale tells decay out</text>

  <path d="M20 375 L8 375 L8 60 L23 60" class="lp" marker-end="url(#b)"/>
  <text x="16" y="338" class="lb">sharpens the meter</text>
</svg>
