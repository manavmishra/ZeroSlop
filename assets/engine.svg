<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Zero Slop engine. A draft is measured by a pattern meter, rhythm and followability statistics, and an optional calibrated MaxEnt channel. Evidence fusion produces an AI-likelihood score from 0 to 100. Diagnose finds hollow spans, inventories facts and marks voice. A two-pass rewrite strips then builds. A verify gate either passes, emitting the rewritten text with a scorecard, or fails and loops back to the rewrite up to three times. Lessons from each run are written to learned.json, which sharpens the pattern meter.">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8F99"/></marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9BCC4"/></marker>
  <style>
    .bx{fill:#F5F5F1;stroke:#D8D7D0;stroke-width:1.5}
    .bxa{fill:#EAF1FC;stroke:#2a78d6;stroke-width:1.6}
    .bxg{fill:#FBFBF8;stroke:#E3E2DC;stroke-width:1.2;stroke-dasharray:4 3}
    .t{font-size:12.5px;fill:#1B1D22}
    .ts{font-size:10.5px;fill:#6E7280}
    .tl{font-size:9.5px;fill:#8A8F99;letter-spacing:.06em}
    .ln{stroke:#8A8F99;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .lnd{stroke:#B9BCC4;stroke-width:1.4;fill:none;stroke-dasharray:4 3;marker-end:url(#ad)}
    @media (prefers-color-scheme:dark){
      .bx{fill:#1C1F26;stroke:#333741}.bxa{fill:#17243A;stroke:#3987e5}
      .bxg{fill:#15171C;stroke:#2B2E36}.t{fill:#E9E8E3}.ts{fill:#A0A4AE}.tl{fill:#7B7F89}
      .ln{stroke:#8A8F99}.lnd{stroke:#565B66}
    }
  </style>
</defs>

<rect x="106" y="18" width="250" height="150" rx="9" class="bxg"/>
<text x="118" y="36" class="tl">MEASURE</text>

<rect x="0" y="78" width="86" height="34" rx="7" class="bx"/>
<text x="43" y="99" class="t" text-anchor="middle">Draft</text>

<rect x="118" y="44" width="226" height="34" rx="7" class="bx"/>
<text x="130" y="59" class="t">Pattern meter</text><text x="130" y="72" class="ts">60+ weighted tells</text>
<rect x="118" y="86" width="226" height="34" rx="7" class="bx"/>
<text x="130" y="101" class="t">Rhythm + followability</text><text x="130" y="114" class="ts">burstiness · density · register</text>
<rect x="118" y="128" width="226" height="34" rx="7" class="bx"/>
<text x="130" y="143" class="t">MaxEnt + Bayesian lexicon</text><text x="130" y="156" class="ts">optional · calibrated · abstains</text>

<rect x="118" y="204" width="226" height="36" rx="7" class="bx"/>
<text x="231" y="221" class="t" text-anchor="middle">learned.json</text>
<text x="231" y="233" class="ts" text-anchor="middle">every miss, dated and logged</text>

<rect x="382" y="70" width="150" height="50" rx="7" class="bxa"/>
<text x="457" y="90" class="t" text-anchor="middle">Evidence fusion</text>
<text x="457" y="105" class="ts" text-anchor="middle">AI-likelihood 0–100</text>

<rect x="570" y="70" width="160" height="50" rx="7" class="bx"/>
<text x="650" y="90" class="t" text-anchor="middle">Diagnose</text>
<text x="650" y="105" class="ts" text-anchor="middle">hollow · facts · voice</text>

<rect x="570" y="168" width="160" height="50" rx="7" class="bx"/>
<text x="650" y="188" class="t" text-anchor="middle">Two-pass rewrite</text>
<text x="650" y="203" class="ts" text-anchor="middle">strip, then build</text>

<path d="M650 266 L712 292 L650 318 L588 292 Z" class="bxa"/>
<text x="650" y="296" class="t" text-anchor="middle">Verify gate</text>

<rect x="768" y="274" width="112" height="36" rx="7" class="bxa"/>
<text x="824" y="291" class="t" text-anchor="middle">Rewritten text</text>
<text x="824" y="303" class="t" text-anchor="middle">+ scorecard</text>

<path d="M86 95 L112 95" class="ln"/>
<path d="M99 95 L99 61 L112 61" class="ln"/>
<path d="M99 95 L99 145 L112 145" class="lnd"/>

<path d="M344 61 L364 61 L364 86 L376 86" class="ln"/>
<path d="M344 103 L376 97" class="ln"/>
<path d="M344 145 L364 145 L364 108 L376 108" class="lnd"/>
<text x="360" y="182" class="tl">second opinion</text>

<path d="M532 95 L564 95" class="ln"/>
<path d="M650 120 L650 162" class="ln"/>
<path d="M650 218 L650 260" class="ln"/>

<path d="M712 292 L762 292" class="ln"/>
<text x="716" y="284" class="tl">pass</text>

<path d="M588 292 L548 292 L548 193 L564 193" class="ln"/>
<text x="452" y="189" class="tl">fail · up to 3x</text>

<path d="M650 318 L650 344 L231 344 L231 246" class="lnd"/>
<text x="380" y="338" class="tl">lessons</text>

<path d="M231 204 L231 174" class="lnd"/>
<text x="240" y="192" class="tl">sharpens the meter</text>
</svg>