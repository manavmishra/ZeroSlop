<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Zero Slop engine. A draft is measured through a pattern meter, rhythm, followability, formatting, register, and an optional model predictability check. The tool diagnoses weak spans, inventories facts and voice, creates several two-pass rewrites, and selects the cleanest faithful version. A numeric gate and fidelity check run before a copy desk and read-aloud editor finish the text. The exact final text is checked again before release. The private learning loop compares that result with what the writer publishes. Repeated cuts become candidate tells, while flagged spans the writer keeps become false-positive evidence. Three independent documents and the human-writing regression corpus gate every local change. A separate shared-review loop exports corroborated evidence without source text, rebuilds each regex locally, requires maintainer review, and rejects the combined update if the regression suite fails.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A939F"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A4FA3"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/>
    </marker>
    <style>
      .surface { fill:#F7F8FA; stroke:#C9CED6; stroke-width:1.2 }
      .ch { fill:#EEF3FA; stroke:#2A78D6; stroke-width:1.2 }
      .hi { fill:#E8F3EC; stroke:#1E7A4C; stroke-width:1.4 }
      .lr { fill:#F4EEF8; stroke:#8A4FA3; stroke-width:1.2 }
      .tn { fill:#FBF6E7; stroke:#C9A227; stroke-width:1.2 }
      .t  { font-size:12px; fill:#1B1D22 }
      .m  { font-size:10px; fill:#5B6270 }
      .h  { font-size:10.5px; fill:#5B6270; letter-spacing:.06em }
      .hp { font-size:10.5px; fill:#8A4FA3; letter-spacing:.06em }
      .ht { font-size:10.5px; fill:#B8860B; letter-spacing:.06em }
      .lb { font-size:9.5px; fill:#8A4FA3 }
      .lg { font-size:9.5px; fill:#5B6270 }
      .ln { stroke:#8A939F; stroke-width:1.3; fill:none }
      .lp { stroke:#8A4FA3; stroke-width:1.3; fill:none; stroke-dasharray:4 3 }
      .lt { stroke:#C9A227; stroke-width:1.3; fill:none }
      .grp{ fill:none; stroke:#C9CED6; stroke-width:1; stroke-dasharray:3 3 }
      .grl{ fill:none; stroke:#8A4FA3; stroke-width:1; stroke-dasharray:3 3 }
      .grt{ fill:none; stroke:#C9A227; stroke-width:1; stroke-dasharray:3 3 }
      @media (prefers-color-scheme: dark) {
        svg { color-scheme: dark }
        .surface { fill:#1E2128; stroke:#3A404B }
        .ch { fill:#16233A; stroke:#4B90E2 }
        .hi { fill:#14291D; stroke:#3FA872 }
        .lr { fill:#241B2E; stroke:#A972C4 }
        .tn { fill:#2A2417; stroke:#C9A227 }
        .t  { fill:#E8EAED }
        .m  { fill:#9AA2AE }
        .h  { fill:#9AA2AE }
        .hp { fill:#A972C4 }
        .ht { fill:#D6B84A }
        .lb { fill:#A972C4 }
        .lg { fill:#9AA2AE }
        .ln { stroke:#6B7280 }
        .grp{ stroke:#3A404B }
      }
    </style>
  </defs>

  <text x="16" y="20" class="h">MEASURE · 4 surface channels · 1 phrase matcher · tunable per author</text>
  <rect x="14" y="28" width="300" height="190" rx="8" class="grp"/>

  <rect x="26" y="40" width="276" height="36" rx="6" class="ch"/>
  <text x="38" y="56" class="t">Pattern meter</text>
  <text x="38" y="69" class="m">266 patterns · 96 lexicon · 25 riders</text>
  <text x="248" y="56" class="lb" fill="#8A939F">wording</text>

  <rect x="26" y="82" width="276" height="36" rx="6" class="ch"/>
  <text x="38" y="98" class="t">Rhythm</text>
  <text x="38" y="111" class="m">sentence-length variation</text>
  <text x="214" y="98" class="lb" fill="#1E7A4C">structural</text>

  <rect x="26" y="124" width="276" height="36" rx="6" class="ch"/>
  <text x="38" y="140" class="t">Followability</text>
  <text x="38" y="153" class="m">comma chains · long-word load</text>
  <text x="214" y="140" class="lb" fill="#1E7A4C">counts + rates</text>

  <rect x="26" y="166" width="276" height="36" rx="6" class="ch"/>
  <text x="38" y="182" class="t">Formatting + register</text>
  <text x="38" y="195" class="m">dashes · emoji · hashtags · tone</text>
  <text x="214" y="182" class="lb" fill="#1E7A4C">counts + rates</text>

  <rect x="14" y="234" width="92" height="42" rx="6" class="surface"/>
  <text x="26" y="260" class="t">Draft</text>
  <path d="M60 234 L60 221" class="ln" marker-end="url(#a)"/>

  <rect x="120" y="226" width="194" height="58" rx="6" class="ch"/>
  <text x="132" y="245" class="t">Predictability</text>
  <text x="132" y="259" class="m">the model channel</text>
  <text x="132" y="273" class="m">reported beside the score</text>
  <path d="M106 255 L118 255" class="ln" marker-end="url(#a)"/>

  <path d="M314 123 L342 123" class="ln" marker-end="url(#a)"/>

  <rect x="344" y="101" width="196" height="44" rx="6" class="surface"/>
  <text x="356" y="120" class="t">Evidence fusion</text>
  <text x="356" y="134" class="m">0-100, every point traceable</text>

  <path d="M442 145 L442 161" class="ln" marker-end="url(#a)"/>
  <rect x="344" y="163" width="196" height="44" rx="6" class="surface"/>
  <text x="356" y="182" class="t">Diagnose</text>
  <text x="356" y="196" class="m">hollow spans · facts · voice</text>

  <path d="M442 207 L442 225" class="ln" marker-end="url(#a)"/>
  <rect x="344" y="227" width="196" height="44" rx="6" class="surface"/>
  <text x="356" y="246" class="t">Two-pass rewrite ×N</text>
  <text x="356" y="260" class="m">strip, build, then rerank</text>

  <path d="M540 249 L560 249" class="ln" marker-end="url(#a)"/>

  <text x="566" y="194" class="h">VERIFY · final artifact clears every check</text>
  <rect x="560" y="200" width="330" height="180" rx="8" class="grp"/>
  <rect x="570" y="206" width="310" height="24" rx="5" class="hi"/>
  <text x="578" y="222" class="m">Numeric gate · score + burstiness</text>
  <rect x="570" y="234" width="310" height="24" rx="5" class="hi"/>
  <text x="578" y="250" class="m">Fidelity · no fact added or lost</text>
  <rect x="570" y="262" width="310" height="24" rx="5" class="hi"/>
  <text x="578" y="278" class="m">Copy desk · grammar, spelling, style</text>
  <rect x="570" y="294" width="310" height="24" rx="5" class="hi"/>
  <text x="578" y="310" class="m">Read-aloud finalizer · flow + cohesion</text>
  <rect x="570" y="334" width="310" height="40" rx="5" class="hi"/>
  <text x="578" y="350" class="t">Final check · format + structure</text>
  <text x="578" y="364" class="m">score · facts · meaning · voice</text>

  <path d="M570 246 L550 246 L550 398 L442 398 L442 274" class="ln" marker-end="url(#a)"/>
  <text x="446" y="394" class="m">initial fail → rewrite ≤ 3×</text>
  <path d="M880 354 L888 354 L888 274 L880 274" class="ln" marker-end="url(#a)"/>
  <text x="800" y="329" class="lg">repair ≤ 3×</text>
  <text x="628" y="394" class="lg">pass → finalized text · scorecard · heatmap</text>

  <text x="16" y="432" class="hp">ADAPT | what writers publish teaches the local meter</text>
  <rect x="14" y="440" width="852" height="92" rx="8" class="grl"/>

  <path d="M725 380 L725 420 L718 420 L718 457" class="lp" marker-end="url(#b)"/>
  <text x="600" y="416" class="lb">you publish an edited version</text>

  <rect x="584" y="460" width="268" height="58" rx="6" class="lr"/>
  <text x="596" y="480" class="t">Your edit</text>
  <text x="596" y="494" class="m">cut a span → candidate tell</text>
  <text x="596" y="508" class="m">kept a flagged one → false positive</text>

  <path d="M584 489 L546 489" class="lp" marker-end="url(#b)"/>
  <rect x="300" y="460" width="244" height="58" rx="6" class="lr"/>
  <text x="312" y="480" class="t">Evidence review</text>
  <text x="312" y="494" class="m">3 documents agree | corpus-safe</text>
  <text x="312" y="508" class="m">new tells must also be novel</text>

  <path d="M300 489 L262 489" class="lp" marker-end="url(#b)"/>
  <rect x="20" y="460" width="240" height="58" rx="6" class="lr"/>
  <text x="32" y="480" class="t">adaptive.json</text>
  <text x="32" y="494" class="m">local rule or weight correction</text>
  <text x="32" y="508" class="m">loaded into the next score</text>

  <path d="M20 489 L8 489 L8 58 L23 58" class="lp" marker-end="url(#b)"/>
  <text x="16" y="452" class="lb">sharpens the meter</text>

  <text x="16" y="550" class="ht">SHARE | reviewed updates clear the full regression suite</text>
  <rect x="14" y="558" width="852" height="66" rx="8" class="grt"/>

  <rect x="20" y="572" width="196" height="42" rx="6" class="tn"/>
  <text x="32" y="591" class="t">Private evidence</text>
  <text x="32" y="605" class="m">corroborated, no source files</text>

  <path d="M216 593 L250 593" class="lt" marker-end="url(#c)"/>
  <rect x="252" y="572" width="286" height="42" rx="6" class="tn"/>
  <text x="264" y="591" class="t">Maintainer review</text>
  <text x="264" y="605" class="m">rebuild regex | check novelty + safety</text>

  <path d="M538 593 L572 593" class="lt" marker-end="url(#c)"/>
  <rect x="574" y="572" width="286" height="42" rx="6" class="tn"/>
  <text x="586" y="591" class="t">learned.json</text>
  <text x="586" y="605" class="m">merge only after regression passes</text>

  <path d="M717 572 L717 566 L118 566 L118 572" class="lt" marker-end="url(#c)"/>
  <text x="356" y="562" class="lg">reviewed release updates the shared detector</text>
</svg>
