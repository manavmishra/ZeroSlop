<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Zero Slop engine. A draft is measured by three interpretable channels: a pattern meter of 68 weighted tells and a 72 term lexicon, rhythm and burstiness statistics, and followability, formatting and register checks. Evidence fusion produces an AI-likelihood score from 0 to 100 in which every point traces to a quoted span. Diagnose finds hollow spans, inventories facts and marks the author voice. A two-pass rewrite strips then builds. A verify gate either passes, emitting the rewritten text with a scorecard, or fails and loops back to the rewrite up to three times. Lessons are written to learned.json, which sharpens the pattern meter.">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8F99"/></marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9BCC4"/></marker>
  <style>
    .bx{fill:#F5F5F1;stroke:#D8D7D0;stroke-width:1.5}
    .bxa{fill:#EAF1FC;stroke:#2a78d6;stroke-width:1.6}
    .bxg{fill:#FBFBF8;stroke:#E3E2DC;stroke-width:1.2;stroke-dasharray:4 3}
    .t{font-size:12.5px;fill:#1B1D22}
    .ts{font-size:10.5px;fill:#6E7280}
    .tl{font-size:9.5px;fill:#8A8F99;letter-spacing:.06em}
    .ln{stroke:#8A8F99;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .lnd{stroke:#B9BCC4;stroke-width:1.4;fill:none;stroke-dasharray:4 3;marker-end:url(#ad)}
    @media (prefers-color-scheme:dark){
      .bx{fill:#1C1F26;stroke:#333741}.bxa{fill:#17243A;stroke:#3987e5}
      .bxg{fill:#15171C;stroke:#2B2E36}.t{fill:#E9E8E3}.ts{fill:#A0A4AE}.tl{fill:#7B7F89}
      .ln{stroke:#8A8F99}.lnd{stroke:#565B66}
    }
  </style>
</defs>

<rect x="106" y="16" width="250" height="152" rx="9" class="bxg"/>
<text x="118" y="34" class="tl">MEASURE · ALL CHANNELS, EVERY RUN</text>

<rect x="0" y="78" width="86" height="34" rx="7" class="bx"/>
<text x="43" y="99" class="t" text-anchor="middle">Draft</text>

<rect x="118" y="42" width="226" height="36" rx="7" class="bx"/>
<text x="130" y="58" class="t">Pattern meter</text><text x="130" y="71" class="ts">68 tells · 72-term lexicon</text>
<rect x="118" y="86" width="226" height="36" rx="7" class="bx"/>
<text x="130" y="102" class="t">Rhythm</text><text x="130" y="115" class="ts">burstiness · uniformity</text>
<rect x="118" y="130" width="226" height="36" rx="7" class="bx"/>
<text x="130" y="146" class="t">Followability + format</text><text x="130" y="159" class="ts">density · dashes · register</text>

<rect x="118" y="200" width="226" height="36" rx="7" class="bx"/>
<text x="231" y="217" class="t" text-anchor="middle">learned.json</text>
<text x="231" y="229" class="ts" text-anchor="middle">every miss, dated and logged</text>

<rect x="382" y="68" width="150" height="52" rx="7" class="bxa"/>
<text x="457" y="88" class="t" text-anchor="middle">Evidence fusion</text>
<text x="457" y="103" class="ts" text-anchor="middle">score 0–100, every</text>
<text x="457" y="115" class="ts" text-anchor="middle">point traceable</text>

<rect x="570" y="70" width="160" height="50" rx="7" class="bx"/>
<text x="650" y="90" class="t" text-anchor="middle">Diagnose</text>
<text x="650" y="105" class="ts" text-anchor="middle">hollow · facts · voice</text>

<rect x="570" y="162" width="160" height="50" rx="7" class="bx"/>
<text x="650" y="182" class="t" text-anchor="middle">Two-pass rewrite</text>
<text x="650" y="197" class="ts" text-anchor="middle">strip, then build</text>

<path d="M650 258 L712 284 L650 310 L588 284 Z" class="bxa"/>
<text x="650" y="288" class="t" text-anchor="middle">Verify gate</text>

<rect x="768" y="266" width="112" height="36" rx="7" class="bxa"/>
<text x="824" y="283" class="t" text-anchor="middle">Rewritten text</text>
<text x="824" y="295" class="t" text-anchor="middle">+ scorecard</text>

<path d="M86 95 L112 95" class="ln"/>
<path d="M99 95 L99 60 L112 60" class="ln"/>
<path d="M99 95 L99 148 L112 148" class="ln"/>

<path d="M344 60 L364 60 L364 84 L376 84" class="ln"/>
<path d="M344 104 L376 96" class="ln"/>
<path d="M344 148 L364 148 L364 108 L376 108" class="ln"/>

<path d="M532 94 L564 94" class="ln"/>
<path d="M650 120 L650 156" class="ln"/>
<path d="M650 212 L650 252" class="ln"/>

<path d="M712 284 L762 284" class="ln"/>
<text x="716" y="276" class="tl">pass</text>

<path d="M588 284 L548 284 L548 187 L564 187" class="ln"/>
<text x="452" y="183" class="tl">fail · up to 3x</text>

<path d="M650 310 L650 330 L231 330 L231 242" class="lnd"/>
<text x="380" y="324" class="tl">lessons</text>

<path d="M231 200 L231 172" class="lnd"/>
<text x="240" y="188" class="tl">sharpens the meter</text>
</svg>