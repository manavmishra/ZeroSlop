<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc" aria-label="Zero Slop has one production workflow, two operational loops, and an independent release gate. Editorial delivery measures, diagnoses, rewrites, copy edits, reads aloud, and verifies. Private online learning observes later human edits, binds reasons to exact source hashes, gates evidence, stores a reversible overlay, and retrieves relevant guidance. A separate release-research lane tests contextual research, performance, fidelity, safety, and cost before any production change. No neural training occurs automatically.">
  <title id="title">How Zero Slop works: one production path, two operational loops, and one independent release gate</title>
  <desc id="desc">The production workflow measures, diagnoses, rewrites, copy edits, reads aloud, and verifies the exact finished copy. Any repair repeats both editorial passes and every final check. A second operational loop learns from later human edits: it binds exact source hashes to stable reasons, gates recurrent evidence for novelty and known-human safety, stores a private reversible overlay, and retrieves only relevant fixes. A separate maintainer release-research lane admits corpora by label quality and tests contextual research, performance, fidelity, safety, cost, and subgroup behavior. It never changes a live draft or promotes itself. No neural training occurs automatically.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#718078"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A56625"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#72528F"/></marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17221C" flood-opacity=".07"/></filter>
    <style>
      .grt{fill:#F5F7F3}.grp{fill:#FBFCF9;stroke:#D2D9D2;stroke-width:1.3}.grl{fill:#F0F3F0;stroke:#AAB4AC}.node{fill:#FFFFFF;stroke:#D4DBD4;stroke-width:1.2}.green{fill:#E8F2EC;stroke:#227B5B}.olive{fill:#EFF3E8;stroke:#71804B}.amber{fill:#F7EFE3;stroke:#A56625}.purple{fill:#F2EDF6;stroke:#72528F}.slate{fill:#F0F3F0;stroke:#AAB4AC}.output{fill:#173D30;stroke:#173D30}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:34px;fill:#17201B}.dek{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;fill:#5E6A63}.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1.6px;fill:#597067}.eyebrowPurple{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1.6px;fill:#72528F}.eyebrowAmber{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1.6px;fill:#8B571D}.stage{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;fill:#17201B}.role{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:1.1px;fill:#6B776F}.body{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;fill:#526058}.small{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;fill:#66736B}.smallStrong{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;fill:#35433B}.whiteLabel{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:1.1px;fill:#CDE1D7}.ln{fill:none;stroke:#718078;stroke-width:1.6}.rp{fill:none;stroke:#A56625;stroke-width:1.7;stroke-dasharray:6 5}.lp{fill:none;stroke:#72528F;stroke-width:1.7;stroke-dasharray:6 5}.badge{fill:#FFFFFF;stroke:#CED6CF;stroke-width:1}.badgeText{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.8px;fill:#56645C}.purpleText{fill:#72528F}.amberText{fill:#8B571D}
      @media (prefers-color-scheme:dark){#background{fill:#101512}.grt{fill:#101512}.grp{fill:#171D18;stroke:#374139}.grl{fill:#1D231E;stroke:#4C574F}.node{fill:#1C231E;stroke:#3B463E}.green{fill:#142A21;stroke:#42A57B}.olive{fill:#242A1B;stroke:#94A561}.amber{fill:#302316;stroke:#C58A43}.purple{fill:#251D2B;stroke:#9D78B7}.slate{fill:#1D231E;stroke:#4C574F}.title,.stage{fill:#EEF3EF}.dek,.body,.small{fill:#AEB9B1}.eyebrow,.role,.badgeText{fill:#9EACA3}.smallStrong{fill:#D7DFD9}.badge{fill:#202721;stroke:#465149}.ln{stroke:#7D8A81}.rp{stroke:#C58A43}.lp{stroke:#9D78B7}.amberText{fill:#D4A05F}.purpleText{fill:#B899CC}}
    </style>
  </defs>

  <rect id="background" width="1600" height="900" class="grt"/>
  <text x="48" y="56" class="title">One production path. Two operational loops.</text>
  <text x="48" y="84" class="dek">The meter stays explainable. Editorial judgment stays source-bound. Learning stays private and reversible.</text>

  <rect x="40" y="116" width="1520" height="308" rx="22" class="grp" filter="url(#softShadow)"/>
  <text x="70" y="154" class="eyebrow">LOOP 1 · EDITORIAL DELIVERY</text><text x="70" y="178" class="dek">One guarded workflow turns the current draft into the exact text the reader receives.</text>
  <rect x="72" y="202" width="220" height="126" rx="14" class="node green"/><text x="92" y="232" class="stage">1 · Measure</text><text x="92" y="253" class="role">LOCAL · DETERMINISTIC</text><text x="92" y="281" class="body">surface score + exact hits</text><text x="92" y="302" class="body">rhythm · density · format</text><text x="92" y="322" class="small">other probes stay separate</text>
  <path d="M292 265H318" class="ln" marker-end="url(#arrow)"/>
  <rect x="318" y="202" width="220" height="126" rx="14" class="node olive"/><text x="338" y="232" class="stage">2 · Diagnose</text><text x="338" y="253" class="role">HOST MODEL · CONTEXT</text><text x="338" y="281" class="body">claims · substance</text><text x="338" y="302" class="body">voice · structure · genre</text><text x="338" y="322" class="small">quote evidence or abstain</text>
  <path d="M538 265H564" class="ln" marker-end="url(#arrow)"/>
  <rect x="564" y="202" width="220" height="126" rx="14" class="node olive"/><text x="584" y="232" class="stage">3 · Rewrite</text><text x="584" y="253" class="role">STRIP · THEN BUILD</text><text x="584" y="281" class="body">repair, cut, or reorder</text><text x="584" y="302" class="body">retrieve relevant fixes</text><text x="584" y="322" class="small">facts outrank cleanliness</text>
  <path d="M784 265H810" class="ln" marker-end="url(#arrow)"/>
  <rect x="810" y="202" width="220" height="126" rx="14" class="node"/><text x="830" y="232" class="stage">4 · Copy edit</text><text x="830" y="253" class="role">FRESH EDITOR</text><text x="830" y="281" class="body">grammar · spelling · usage</text><text x="830" y="302" class="body">diction · consistency</text><text x="830" y="322" class="small">edit the actual deliverable</text>
  <path d="M1030 265H1056" class="ln" marker-end="url(#arrow)"/>
  <rect x="1056" y="202" width="220" height="126" rx="14" class="node"/><text x="1076" y="232" class="stage">5 · Read aloud</text><text x="1076" y="253" class="role">FRESH EDITOR</text><text x="1076" y="281" class="body">flow · cohesion · joins</text><text x="1076" y="302" class="body">repetition · register</text><text x="1076" y="322" class="small">fix every safe stumble</text>
  <path d="M1276 265H1302" class="ln" marker-end="url(#arrow)"/>
  <rect x="1302" y="202" width="220" height="126" rx="14" class="node amber"/><text x="1322" y="232" class="stage">6 · Verify</text><text x="1322" y="253" class="role">SCRIPTS + HOST MODEL</text><text x="1322" y="281" class="body">score · facts · meaning</text><text x="1322" y="302" class="body">voice · format · structure</text><text x="1322" y="322" class="small">check the exact finished copy</text>
  <path d="M1412 328V364H920V329" class="rp" marker-end="url(#amberArrow)"/><text x="1000" y="357" class="small amberText">any repair → copy edit → read aloud → all checks again</text>
  <rect x="1302" y="371" width="220" height="30" rx="15" class="output"/><text x="1412" y="391" text-anchor="middle" class="whiteLabel">FINISHED COPY · EXACT OUTPUT</text>

  <rect x="40" y="454" width="980" height="406" rx="22" class="grp"/>
  <text x="70" y="492" class="eyebrowPurple">LOOP 2 · PRIVATE ONLINE LEARNING</text><text x="70" y="516" class="dek">Later human edits become bounded evidence. Nothing retrains the host model or edits the skill.</text>
  <rect x="70" y="558" width="170" height="142" rx="14" class="node purple"/><text x="88" y="588" class="stage">1 · Observe</text><text x="88" y="609" class="role">RETURNED ↔ PUBLISHED</text><text x="88" y="637" class="body">cuts + replacements</text><text x="88" y="658" class="body">kept flagged text</text><text x="88" y="679" class="small">one pair = one vote</text>
  <path d="M240 629H256" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="256" y="558" width="170" height="142" rx="14" class="node purple"/><text x="274" y="588" class="stage">2 · Bind</text><text x="274" y="609" class="role">HASHES + REASONS</text><text x="274" y="637" class="body">exact before / after</text><text x="274" y="658" class="small">span · reason · genre</text><text x="274" y="679" class="small">bad hash/span → reject</text>
  <path d="M426 629H442" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="442" y="558" width="170" height="142" rx="14" class="node purple"/><text x="460" y="588" class="stage">3 · Gate</text><text x="460" y="609" class="role">FAIL CLOSED</text><text x="460" y="637" class="body">recurrence · novelty</text><text x="460" y="658" class="body">known-human safety</text><text x="460" y="679" class="small">distinct evidence</text>
  <path d="M612 629H628" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="628" y="558" width="170" height="142" rx="14" class="node purple"/><text x="646" y="588" class="stage">4 · Store</text><text x="646" y="609" class="role">PRIVATE OVERLAY</text><text x="646" y="637" class="body">patterns + weights</text><text x="646" y="658" class="body">fixes + dates</text><text x="646" y="679" class="small">private · reversible</text>
  <path d="M798 629H814" class="lp" marker-end="url(#purpleArrow)"/>
  <rect x="814" y="558" width="170" height="142" rx="14" class="node purple"/><text x="832" y="588" class="stage">5 · Retrieve</text><text x="832" y="609" class="role">NEXT EDITORIAL RUN</text><text x="832" y="637" class="body">relevant fixes only</text><text x="832" y="658" class="body">reconfirm or decay</text><text x="832" y="679" class="small">no match → abstain</text>
  <path d="M182 558V538H106V424" class="lp" marker-end="url(#purpleArrow)"/><text x="122" y="532" class="small purpleText">local detector weights → Measure</text>
  <path d="M899 558V530H674V424" class="lp" marker-end="url(#purpleArrow)"/><text x="720" y="524" class="small purpleText">retrieved fixes → Rewrite</text>
  <rect x="70" y="746" width="914" height="72" rx="13" class="grl"/><text x="92" y="773" class="smallStrong">Lifecycle safeguards</text><text x="92" y="796" class="body">3 distinct edit pairs for a phrase · 5 for a single word · 18-month decay · private by default</text><rect x="764" y="763" width="194" height="30" rx="15" class="badge"/><text x="861" y="783" text-anchor="middle" class="badgeText">NO NEURAL TRAINING</text>

  <rect x="1044" y="454" width="516" height="406" rx="22" class="grp"/>
  <text x="1074" y="492" class="eyebrowAmber">RELEASE RESEARCH · NOT A RUNTIME LOOP</text><text x="1074" y="516" class="dek">Tests proposed changes; never edits live copy.</text>
  <rect x="1074" y="558" width="210" height="108" rx="14" class="node slate"/><text x="1092" y="588" class="stage">Admit corpora</text><text x="1092" y="609" class="role">LABELS · LICENSE · HASHES</text><text x="1092" y="637" class="body">match labels to the claim</text><text x="1092" y="656" class="small">group sources; block leakage</text>
  <path d="M1284 612H1304" class="ln" marker-end="url(#arrow)"/>
  <rect x="1304" y="558" width="226" height="108" rx="14" class="node slate"/><text x="1322" y="588" class="stage">Blind evaluation</text><text x="1322" y="609" class="role">METHOD-HIDDEN · SPLIT-SAFE</text><text x="1322" y="637" class="body">contextual research</text><text x="1322" y="656" class="small">retain disagreement</text>
  <path d="M1417 666V686" class="ln" marker-end="url(#arrow)"/>
  <rect x="1074" y="686" width="456" height="90" rx="14" class="node amber"/><text x="1094" y="716" class="stage">Performance · fidelity · safety · cost</text><text x="1094" y="739" class="body">Compare versions on the same held-out material.</text><text x="1094" y="760" class="small">Report uncertainty, subgroup behavior, and every abstention.</text>
  <rect x="1074" y="798" width="456" height="36" rx="18" class="amber"/><text x="1302" y="821" text-anchor="middle" class="badgeText amberText">HUMAN-VALIDATED GAIN → REVIEWED RELEASE</text>
</svg>
