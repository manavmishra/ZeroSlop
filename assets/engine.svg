<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Zero Slop has two operational loops. In editorial delivery, deterministic local Python measures traceable surface evidence. The host language model interprets the draft and edits it contextually. Scripts and the model then verify the exact text returned. Predictability and portfolio probes are reported as separate diagnostics. In private online learning, evidence from published edits passes recurrence, novelty, and known-human safety checks before it can update local detector weights or preferred fixes. The private overlay informs the next scoring and rewrite cycle but does not retrain the host model. External taxonomies enter only through a reviewed, tested, versioned maintenance release.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A939F"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A4FA3"/>
    </marker>
    <style>
      .surface { fill:#F7F8FA; stroke:#C9CED6; stroke-width:1.2 }
      .ch { fill:#EEF3FA; stroke:#2A78D6; stroke-width:1.2 }
      .ai { fill:#E8F3EC; stroke:#1E7A4C; stroke-width:1.4 }
      .hi { fill:#F7F1E6; stroke:#A66A20; stroke-width:1.2 }
      .lr { fill:#F4EEF8; stroke:#8A4FA3; stroke-width:1.2 }
      .t  { font-size:12px; fill:#1B1D22 }
      .m  { font-size:10px; fill:#5B6270 }
      .h  { font-size:10.5px; fill:#5B6270; letter-spacing:.06em }
      .ey { font-size:9.5px; fill:#5B6270; letter-spacing:.08em }
      .hp { font-size:10.5px; fill:#8A4FA3; letter-spacing:.06em }
      .lb { font-size:9.5px; fill:#8A4FA3 }
      .lg { font-size:9.5px; fill:#5B6270 }
      .ln { stroke:#8A939F; stroke-width:1.3; fill:none }
      .lp { stroke:#8A4FA3; stroke-width:1.3; fill:none; stroke-dasharray:4 3 }
      .grp{ fill:none; stroke:#C9CED6; stroke-width:1; stroke-dasharray:3 3 }
      .grl{ fill:none; stroke:#8A4FA3; stroke-width:1; stroke-dasharray:3 3 }
      @media (prefers-color-scheme: dark) {
        svg { color-scheme: dark }
        .surface { fill:#1E2128; stroke:#3A404B }
        .ch { fill:#16233A; stroke:#4B90E2 }
        .ai { fill:#14291D; stroke:#3FA872 }
        .hi { fill:#302617; stroke:#C58A43 }
        .lr { fill:#241B2E; stroke:#A972C4 }
        .t  { fill:#E8EAED }
        .m  { fill:#9AA2AE }
        .h  { fill:#9AA2AE }
        .ey { fill:#9AA2AE }
        .hp { fill:#A972C4 }
        .lb { fill:#A972C4 }
        .lg { fill:#9AA2AE }
        .ln { stroke:#6B7280 }
        .grp{ stroke:#3A404B }
      }
    </style>
  </defs>

  <text x="20" y="24" class="h">LOOP 1 · EDITORIAL DELIVERY</text>
  <text x="20" y="41" class="m">measure → diagnose → rewrite → copy edit → read aloud → verify</text>

  <rect x="20" y="58" width="285" height="252" rx="10" class="ch"/>
  <text x="36" y="82" class="ey">DETERMINISTIC MEASUREMENT</text>
  <text x="36" y="104" class="t">Local Python</text>
  <text x="36" y="128" class="m">Find traceable surface evidence.</text>
  <text x="47" y="163" class="m">Pattern meter · quoted spans</text>
  <line x1="36" y1="174" x2="289" y2="174" stroke="#C9CED6"/>
  <text x="47" y="197" class="m">Rhythm · sentence-length variation</text>
  <line x1="36" y1="208" x2="289" y2="208" stroke="#C9CED6"/>
  <text x="47" y="231" class="m">Followability · density + long sentences</text>
  <line x1="36" y1="242" x2="289" y2="242" stroke="#C9CED6"/>
  <text x="47" y="265" class="m">Formatting + register · counts + rates</text>
  <line x1="36" y1="276" x2="289" y2="276" stroke="#C9CED6"/>
  <text x="36" y="294" class="m">0–100 score · traceable surface evidence</text>

  <path d="M305 184 L357 184" class="ln" marker-end="url(#a)"/>
  <text x="314" y="174" class="lg">guides</text>

  <rect x="360" y="58" width="285" height="252" rx="10" class="ai"/>
  <text x="376" y="82" class="ey">CONTEXTUAL AI EDITING</text>
  <text x="376" y="104" class="t">Host language model</text>
  <text x="376" y="128" class="m">Interpret the draft before changing it.</text>
  <text x="387" y="163" class="m">Substance + factual scope</text>
  <line x1="376" y1="174" x2="629" y2="174" stroke="#C9CED6"/>
  <text x="387" y="197" class="m">Structure + audience</text>
  <line x1="376" y1="208" x2="629" y2="208" stroke="#C9CED6"/>
  <text x="387" y="231" class="m">Rewrite + copy edit</text>
  <line x1="376" y1="242" x2="629" y2="242" stroke="#C9CED6"/>
  <text x="387" y="265" class="m">Read aloud + fix flow</text>
  <line x1="376" y1="276" x2="629" y2="276" stroke="#C9CED6"/>
  <text x="376" y="294" class="m">Claude · GPT · another compatible model</text>

  <path d="M645 184 L697 184" class="ln" marker-end="url(#a)"/>
  <text x="655" y="174" class="lg">checks</text>

  <rect x="700" y="58" width="280" height="252" rx="10" class="hi"/>
  <text x="716" y="82" class="ey">FINAL VERIFICATION</text>
  <text x="716" y="104" class="t">Scripts + host model</text>
  <text x="716" y="128" class="m">Check the exact text you receive.</text>
  <text x="727" y="163" class="m">Score + quoted evidence</text>
  <line x1="716" y1="174" x2="964" y2="174" stroke="#C9CED6"/>
  <text x="727" y="197" class="m">Figures + names + quotations + links</text>
  <line x1="716" y1="208" x2="964" y2="208" stroke="#C9CED6"/>
  <text x="727" y="231" class="m">Meaning + qualifiers + voice</text>
  <line x1="716" y1="242" x2="964" y2="242" stroke="#C9CED6"/>
  <text x="727" y="265" class="m">Format + structure + spoken flow</text>
  <line x1="716" y1="276" x2="964" y2="276" stroke="#C9CED6"/>
  <text x="716" y="294" class="m">text change → both editors → every check</text>

  <rect x="20" y="330" width="960" height="34" rx="7" class="surface"/>
  <text x="36" y="351" class="m">Separate diagnostics · host-model predictability · portfolio probe for repetition across 3+ related drafts · neither changes the surface score</text>

  <text x="20" y="399" class="hp">LOOP 2 · PRIVATE ONLINE LEARNING</text>
  <text x="20" y="416" class="m">observe → gate evidence → update private overlay → reconfirm / decay</text>
  <text x="728" y="407" class="lb">does not retrain the host model</text>
  <rect x="20" y="430" width="960" height="116" rx="10" class="grl"/>

  <rect x="700" y="447" width="264" height="82" rx="7" class="lr"/>
  <text x="716" y="469" class="t">Published edit</text>
  <text x="716" y="487" class="m">cut span · kept flag · preferred fix</text>
  <text x="716" y="505" class="m">human feedback becomes evidence</text>

  <path d="M700 488 L647 488" class="lp" marker-end="url(#b)"/>
  <rect x="360" y="447" width="285" height="82" rx="7" class="lr"/>
  <text x="376" y="469" class="t">Evidence checks</text>
  <text x="376" y="487" class="m">recurrence · novelty · known-human safety</text>
  <text x="376" y="505" class="m">one edit cannot activate a rule or fix</text>

  <path d="M360 488 L307 488" class="lp" marker-end="url(#b)"/>
  <rect x="36" y="447" width="269" height="82" rx="7" class="lr"/>
  <text x="52" y="469" class="t">Private overlay</text>
  <text x="52" y="487" class="m">detector weights + fix preferences</text>
  <text x="52" y="505" class="m">reconfirm · decay rules · retire fixes</text>
  <text x="52" y="521" class="lb">adapts detection + fixing on the next run</text>

  <rect x="20" y="576" width="960" height="36" rx="7" class="grp"/>
  <text x="36" y="598" class="h">MAINTENANCE · NOT A RUNTIME LOOP · external taxonomy → review → human-corpus regression → versioned release</text>

</svg>
