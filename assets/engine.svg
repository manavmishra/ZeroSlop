<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Zero Slop engine. A draft is measured by three interpretable channels: a pattern meter of 266 weighted tells with a 96-term lexicon and 25 context-gated riders, the only channel that reads specific wording, plus rhythm and followability, both blind to wording and so surviving a rewrite. A fifth, model channel called predictability asks the host model to guess masked words and reports how often it succeeds, shipping no model of its own and reported beside the score rather than fused into it. Evidence fusion produces an AI-likelihood score from 0 to 100 in which every point traces to a quoted span. Diagnose finds hollow spans, inventories facts and marks the author voice. A two-pass rewrite strips the tells then rebuilds toward an expert register, produced as several candidates and reranked to the cleanest one that keeps every fact. A verify gate passes only when all three checks clear: the numeric gate on likelihood and burstiness, a readalong pass that reads the rewrite aloud and flags stumbles, transitions and repetition, and a fidelity check that adds or loses no fact; any failure loops back to the rewrite up to three times, and passing emits the rewritten text with a scorecard and heatmap. Below runs the reflect loop: when you publish an edited version, a span you cut becomes a candidate tell and a flagged span you kept becomes false-positive evidence, and neither changes anything until three gates pass — three independent documents agree, the span is not already caught, and it clears the corpus of certified human writing — after which learned.json raises patterns, lowers weights and lets stale tells decay, sharpening the meter. A separate tune band shows SkillOpt optimizing the SKILL.md instructions against an eval harness of de-slop gain, fidelity and the gate, keeping a candidate only when a held-out validation score improves; this is a maintainer step and runs offline of the user.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A939F"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A4FA3"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/>
    </marker>
    <style>
      .s  { fill:#F7F8FA; stroke:#C9CED6; stroke-width:1.2 }
      .ch { fill:#EEF3FA; stroke:#2A78D6; stroke-width:1.2 }
      .hi { fill:#E8F3EC; stroke:#1E7A4C; stroke-width:1.4 }
      .lr { fill:#F4EEF8; stroke:#8A4FA3; stroke-width:1.2 }
      .tn { fill:#FBF6E7; stroke:#C9A227; stroke-width:1.2 }
      .t  { font-size:12px; fill:#1B1D22 }
      .m  { font-size:10px; fill:#5B6270 }
      .h  { font-size:10.5px; fill:#5B6270; letter-spacing:.06em }
      .hp { font-size:10.5px; fill:#8A4FA3; letter-spacing:.06em }
      .ht { font-size:10.5px; fill:#B8860B; letter-spacing:.06em }
      .lb { font-size:9.5px; fill:#8A4FA3 }
      .lg { font-size:9.5px; fill:#5B6270 }
      .ln { stroke:#8A939F; stroke-width:1.3; fill:none }
      .lp { stroke:#8A4FA3; stroke-width:1.3; fill:none; stroke-dasharray:4 3 }
      .lt { stroke:#C9A227; stroke-width:1.3; fill:none }
      .grp{ fill:none; stroke:#C9CED6; stroke-width:1; stroke-dasharray:3 3 }
      .grl{ fill:none; stroke:#8A4FA3; stroke-width:1; stroke-dasharray:3 3 }
      .grt{ fill:none; stroke:#C9A227; stroke-width:1; stroke-dasharray:3 3 }
      @media (prefers-color-scheme: dark) {
        .s  { fill:#1E2128; stroke:#3A404B }
        .ch { fill:#16233A; stroke:#4B90E2 }
        .hi { fill:#14291D; stroke:#3FA872 }
        .lr { fill:#241B2E; stroke:#A972C4 }
        .tn { fill:#2A2417; stroke:#C9A227 }
        .t  { fill:#E8EAED }
        .m  { fill:#9AA2AE }
        .h  { fill:#9AA2AE }
        .hp { fill:#A972C4 }
        .ht { fill:#D6B84A }
        .lb { fill:#A972C4 }
        .lg { fill:#9AA2AE }
        .ln { stroke:#6B7280 }
        .grp{ stroke:#3A404B }
      }
    </style>
  </defs>

  <text x="16" y="20" class="h">MEASURE · every channel · 3 of 4 blind to wording · tunable per author</text>
  <rect x="14" y="28" width="300" height="152" rx="8" class="grp"/>

  <rect x="26" y="40" width="276" height="40" rx="6" class="ch"/>
  <text x="38" y="58" class="t">Pattern meter</text>
  <text x="38" y="72" class="m">266 tells · 96 lexicon · 25 riders</text>
  <text x="248" y="58" class="lb" fill="#8A939F">wording</text>

  <rect x="26" y="86" width="276" height="40" rx="6" class="ch"/>
  <text x="38" y="104" class="t">Rhythm</text>
  <text x="38" y="118" class="m">burstiness · uniformity · shape</text>
  <text x="214" y="104" class="lb" fill="#1E7A4C">wording-blind</text>

  <rect x="26" y="132" width="276" height="40" rx="6" class="ch"/>
  <text x="38" y="150" class="t">Followability + format</text>
  <text x="38" y="164" class="m">density · dashes · register</text>
  <text x="214" y="150" class="lb" fill="#1E7A4C">wording-blind</text>

  <rect x="14" y="200" width="92" height="42" rx="6" class="s"/>
  <text x="26" y="226" class="t">Draft</text>
  <path d="M60 200 L60 183" class="ln" marker-end="url(#a)"/>

  <rect x="120" y="196" width="194" height="58" rx="6" class="ch"/>
  <text x="132" y="215" class="t">Predictability</text>
  <text x="132" y="229" class="m">the model channel</text>
  <text x="132" y="243" class="m">uses the host model</text>
  <path d="M106 221 L118 221" class="ln" marker-end="url(#a)"/>

  <path d="M314 104 L342 104" class="ln" marker-end="url(#a)"/>

  <rect x="344" y="82" width="196" height="44" rx="6" class="s"/>
  <text x="356" y="101" class="t">Evidence fusion</text>
  <text x="356" y="115" class="m">0–100, every point traceable</text>

  <path d="M442 126 L442 152" class="ln" marker-end="url(#a)"/>
  <rect x="344" y="154" width="196" height="44" rx="6" class="s"/>
  <text x="356" y="173" class="t">Diagnose</text>
  <text x="356" y="187" class="m">hollow spans · facts · voice</text>

  <path d="M442 198 L442 226" class="ln" marker-end="url(#a)"/>
  <rect x="344" y="228" width="196" height="44" rx="6" class="s"/>
  <text x="356" y="247" class="t">Two-pass rewrite ×N</text>
  <text x="356" y="261" class="m">strip, build, then rerank</text>

  <path d="M540 250 L560 250" class="ln" marker-end="url(#a)"/>

  <text x="566" y="200" class="h">VERIFY · all three must pass</text>
  <rect x="560" y="206" width="330" height="92" rx="8" class="grp"/>
  <rect x="570" y="212" width="310" height="24" rx="5" class="hi"/>
  <text x="578" y="228" class="m">Numeric gate · likelihood, burstiness</text>
  <rect x="570" y="240" width="310" height="24" rx="5" class="hi"/>
  <text x="578" y="256" class="m">Readalong · reads aloud, flags stumbles</text>
  <rect x="570" y="268" width="310" height="24" rx="5" class="hi"/>
  <text x="578" y="284" class="m">Fidelity · no fact added or lost</text>

  <path d="M600 298 L600 312 L442 312 L442 274" class="ln" marker-end="url(#a)"/>
  <text x="470" y="308" class="m">fail → retry ≤ 3×</text>
  <text x="628" y="308" class="lg">pass → text · scorecard · heatmap</text>

  <text x="16" y="336" class="hp">REFLECT · what you changed teaches the meter</text>
  <rect x="14" y="344" width="852" height="92" rx="8" class="grl"/>

  <path d="M725 298 L725 324 L718 324 L718 361" class="lp" marker-end="url(#b)"/>
  <text x="600" y="320" class="lb">you publish an edited version</text>

  <rect x="584" y="364" width="268" height="58" rx="6" class="lr"/>
  <text x="596" y="384" class="t">Your edit</text>
  <text x="596" y="398" class="m">cut a span → candidate tell</text>
  <text x="596" y="412" class="m">kept a flagged one → false positive</text>

  <path d="M584 393 L546 393" class="lp" marker-end="url(#b)"/>
  <rect x="300" y="364" width="244" height="58" rx="6" class="lr"/>
  <text x="312" y="384" class="t">Three gates</text>
  <text x="312" y="398" class="m">3 documents agree · not already</text>
  <text x="312" y="412" class="m">caught · clears the human corpus</text>

  <path d="M300 393 L262 393" class="lp" marker-end="url(#b)"/>
  <rect x="20" y="364" width="240" height="58" rx="6" class="lr"/>
  <text x="32" y="384" class="t">learned.json</text>
  <text x="32" y="398" class="m">patterns up, weights down,</text>
  <text x="32" y="412" class="m">stale tells decay out</text>

  <path d="M20 393 L8 393 L8 60 L23 60" class="lp" marker-end="url(#b)"/>
  <text x="16" y="356" class="lb">sharpens the meter</text>

  <text x="16" y="454" class="ht">TUNE · SkillOpt rewrites the instructions to score higher · a build step, not a user step</text>
  <rect x="14" y="462" width="852" height="66" rx="8" class="grt"/>

  <rect x="20" y="476" width="196" height="42" rx="6" class="tn"/>
  <text x="32" y="495" class="t">SKILL.md</text>
  <text x="32" y="509" class="m">the rewrite instructions</text>

  <path d="M216 497 L250 497" class="lt" marker-end="url(#c)"/>
  <rect x="252" y="476" width="286" height="42" rx="6" class="tn"/>
  <text x="264" y="495" class="t">Run + reward</text>
  <text x="264" y="509" class="m">run drafts · reward.py: fidelity + de-slop</text>

  <path d="M538 497 L572 497" class="lt" marker-end="url(#c)"/>
  <rect x="574" y="476" width="286" height="42" rx="6" class="tn"/>
  <text x="586" y="495" class="t">best_skill.md</text>
  <text x="586" y="509" class="m">kept only if the val score rises</text>

  <path d="M717 476 L717 470 L118 470 L118 476" class="lt" marker-end="url(#c)"/>
  <text x="360" y="466" class="lg">commit the winner · gated on a held-out split</text>
</svg>
