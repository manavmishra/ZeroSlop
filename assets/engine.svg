<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Zero Slop has two connected operational loops. Editorial delivery moves a current draft through local measurement, contextual diagnosis and rewriting, a dedicated copy editor, a fresh read-aloud editor, and final verification. When a check fails, the text returns for repair; both editorial passes and every check then run again before delivery. Private online learning starts only when both Zero Slop's returned copy and the writer's later published edit are available. It observes the difference, gates the evidence for recurrence, novelty, and known-human safety, and updates a local overlay. Detector weights guide measurement on the next run, while preferred fixes guide rewriting. Later evidence reconfirms useful lessons; stale weights decay and stale fixes retire. The loop never retrains the host model. External taxonomies enter only through reviewed, tested, versioned maintenance releases.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7B8491"/>
    </marker>
    <marker id="repair-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A66A20"/>
    </marker>
    <marker id="learn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#82549A"/>
    </marker>
    <style>
      .grp { fill:#FBFCFD; stroke:#C9CED6; stroke-width:1.2; stroke-dasharray:4 4 }
      .measure { fill:#EEF3FA; stroke:#2A78D6; stroke-width:1.2 }
      .model { fill:#E8F3EC; stroke:#1E7A4C; stroke-width:1.2 }
      .editor { fill:#F0F5ED; stroke:#5F7F4A; stroke-width:1.2 }
      .verify { fill:#F7F1E6; stroke:#A66A20; stroke-width:1.2 }
      .learn { fill:#F4EEF8; stroke:#82549A; stroke-width:1.2 }
      .neutral { fill:#F7F8FA; stroke:#C9CED6; stroke-width:1.1 }
      .title { font-size:14px; font-weight:700; fill:#191C21; letter-spacing:.08em }
      .loop { font-size:11px; font-weight:700; fill:#4E5662; letter-spacing:.08em }
      .stage { font-size:13px; font-weight:700; fill:#191C21 }
      .role { font-size:9px; fill:#5B6270; letter-spacing:.08em }
      .body { font-size:10px; fill:#4E5662 }
      .note { font-size:9.5px; fill:#626B78 }
      .learn-title { font-size:11px; font-weight:700; fill:#82549A; letter-spacing:.08em }
      .learn-note { font-size:9.5px; fill:#82549A }
      .ln { stroke:#7B8491; stroke-width:1.35; fill:none }
      .rp { stroke:#A66A20; stroke-width:1.35; fill:none; stroke-dasharray:4 3 }
      .lp { stroke:#82549A; stroke-width:1.35; fill:none; stroke-dasharray:4 3 }
      @media (prefers-color-scheme: dark) {
        svg { color-scheme:dark }
        .grp { fill:#171A20; stroke:#3A404B }
        .measure { fill:#16233A; stroke:#4B90E2 }
        .model { fill:#14291D; stroke:#3FA872 }
        .editor { fill:#202A1B; stroke:#789D61 }
        .verify { fill:#302617; stroke:#C58A43 }
        .learn { fill:#241B2E; stroke:#A972C4 }
        .neutral { fill:#1E2128; stroke:#3A404B }
        .title,.stage { fill:#E8EAED }
        .loop,.role,.body,.note { fill:#A2A9B4 }
        .learn-title,.learn-note { fill:#B987CF }
        .ln { stroke:#737C89 }
        .rp { stroke:#C58A43 }
        .lp { stroke:#A972C4 }
      }
    </style>
  </defs>

  <text x="20" y="28" class="title">ZERO SLOP · TWO CONNECTED OPERATIONAL LOOPS</text>
  <text x="20" y="48" class="note">The first loop finishes today's draft. The second learns cautiously from what the writer later publishes and informs the next run.</text>

  <rect x="20" y="70" width="1160" height="286" rx="12" class="grp"/>
  <text x="40" y="96" class="loop">LOOP 1 · EDITORIAL DELIVERY · CURRENT DRAFT</text>
  <text x="40" y="114" class="note">measure → diagnose → rewrite → copy edit → read aloud → verify</text>

  <rect x="40" y="132" width="160" height="112" rx="8" class="measure"/>
  <text x="54" y="156" class="stage">Measure</text>
  <text x="54" y="174" class="role">LOCAL SCRIPT</text>
  <text x="54" y="199" class="body">surface score</text>
  <text x="54" y="216" class="body">quoted evidence</text>
  <text x="54" y="233" class="body">document statistics</text>
  <path d="M200 188 L224 188" class="ln" marker-end="url(#arrow)"/>

  <rect x="225" y="132" width="160" height="112" rx="8" class="model"/>
  <text x="239" y="156" class="stage">Diagnose</text>
  <text x="239" y="174" class="role">HOST MODEL</text>
  <text x="239" y="199" class="body">substance + claims</text>
  <text x="239" y="216" class="body">structure + audience</text>
  <text x="239" y="233" class="body">voice + delivery</text>
  <path d="M385 188 L409 188" class="ln" marker-end="url(#arrow)"/>

  <rect x="410" y="132" width="160" height="112" rx="8" class="model"/>
  <text x="424" y="156" class="stage">Rewrite</text>
  <text x="424" y="174" class="role">HOST MODEL</text>
  <text x="424" y="199" class="body">strip, then rebuild</text>
  <text x="424" y="216" class="body">preserve facts + voice</text>
  <text x="424" y="233" class="body">compare approaches</text>
  <path d="M570 188 L594 188" class="ln" marker-end="url(#arrow)"/>

  <rect x="595" y="132" width="160" height="112" rx="8" class="editor"/>
  <text x="609" y="156" class="stage">Copy edit</text>
  <text x="609" y="174" class="role">FRESH EDITOR</text>
  <text x="609" y="199" class="body">grammar + spelling</text>
  <text x="609" y="216" class="body">clarity + consistency</text>
  <text x="609" y="233" class="body">professional finish</text>
  <path d="M755 188 L779 188" class="ln" marker-end="url(#arrow)"/>

  <rect x="780" y="132" width="160" height="112" rx="8" class="editor"/>
  <text x="794" y="156" class="stage">Read aloud</text>
  <text x="794" y="174" class="role">FRESH EDITOR</text>
  <text x="794" y="199" class="body">spoken flow</text>
  <text x="794" y="216" class="body">cohesion + rhythm</text>
  <text x="794" y="233" class="body">fix every stumble</text>
  <path d="M940 188 L964 188" class="ln" marker-end="url(#arrow)"/>

  <rect x="965" y="132" width="195" height="112" rx="8" class="verify"/>
  <text x="979" y="156" class="stage">Verify</text>
  <text x="979" y="174" class="role">SCRIPTS + HOST MODEL</text>
  <text x="979" y="199" class="body">score + fidelity checks</text>
  <text x="979" y="216" class="body">meaning + qualifiers</text>
  <text x="979" y="233" class="body">voice + format + flow</text>

  <path d="M1062 244 L1062 272 L490 272 L490 245" class="rp" marker-end="url(#repair-arrow)"/>
  <text x="612" y="266" class="note">failed check → repair → both editors → every check again</text>
  <path d="M1118 244 L1118 293" class="ln" marker-end="url(#arrow)"/>
  <text x="1127" y="273" class="note">pass</text>
  <rect x="965" y="294" width="195" height="42" rx="7" class="neutral"/>
  <text x="979" y="313" class="stage">Finished copy</text>
  <text x="979" y="328" class="note">the exact text returned</text>

  <text x="40" y="315" class="role">SEPARATE DIAGNOSTICS</text>
  <text x="40" y="333" class="note">predictability · portfolio probe for repetition across 3+ related drafts · neither changes the surface score</text>

  <path d="M1062 336 L1062 472" class="lp" marker-end="url(#learn-arrow)"/>
  <text x="794" y="378" class="learn-note">later, when both versions are available</text>

  <rect x="20" y="396" width="1160" height="278" rx="12" class="grp"/>
  <text x="40" y="422" class="learn-title">LOOP 2 · PRIVATE ONLINE LEARNING · LATER HUMAN EDIT</text>
  <text x="40" y="440" class="note">observe → gate evidence → update private overlay → use on the next run</text>
  <text x="930" y="422" class="learn-note">local · inspectable · reversible</text>
  <text x="930" y="440" class="learn-note">never retrains the host model</text>

  <rect x="40" y="472" width="180" height="112" rx="8" class="learn"/>
  <text x="54" y="496" class="stage">4 · Use on next run</text>
  <text x="54" y="514" class="role">FEEDS LOOP 1</text>
  <text x="54" y="539" class="body">weights → Measure</text>
  <text x="54" y="556" class="body">fixes → Rewrite</text>
  <text x="54" y="573" class="body">meaning must be preserved</text>

  <path d="M280 528 L221 528" class="lp" marker-end="url(#learn-arrow)"/>
  <rect x="280" y="472" width="240" height="112" rx="8" class="learn"/>
  <text x="294" y="496" class="stage">3 · Update private overlay</text>
  <text x="294" y="514" class="role">ACTIVATED LOCALLY</text>
  <text x="294" y="539" class="body">detector weights + fix preferences</text>
  <text x="294" y="556" class="body">provenance + dates</text>
  <text x="294" y="573" class="learn-note">adapts detection + fixing</text>

  <path d="M580 528 L521 528" class="lp" marker-end="url(#learn-arrow)"/>
  <rect x="580" y="472" width="240" height="112" rx="8" class="learn"/>
  <text x="594" y="496" class="stage">2 · Gate evidence</text>
  <text x="594" y="514" class="role">SAFETY BEFORE ACTIVATION</text>
  <text x="594" y="539" class="body">recurrence</text>
  <text x="594" y="556" class="body">novelty</text>
  <text x="594" y="573" class="body">known-human safety</text>

  <path d="M880 528 L821 528" class="lp" marker-end="url(#learn-arrow)"/>
  <rect x="880" y="472" width="280" height="112" rx="8" class="learn"/>
  <text x="894" y="496" class="stage">1 · Observe</text>
  <text x="894" y="514" class="role">RETURNED COPY ↔ PUBLISHED EDIT</text>
  <text x="894" y="539" class="body">cut text · kept flagged text</text>
  <text x="894" y="556" class="body">recurring replacement</text>
  <text x="894" y="573" class="body">edit difference becomes evidence</text>

  <rect x="280" y="610" width="240" height="42" rx="7" class="learn"/>
  <text x="294" y="628" class="stage">Reconfirm / decay</text>
  <text x="294" y="644" class="note">decay weights · retire fixes</text>
  <path d="M400 584 L400 609" class="lp" marker-start="url(#learn-arrow)" marker-end="url(#learn-arrow)"/>

  <path d="M130 472 L130 354" class="lp" marker-end="url(#learn-arrow)"/>
  <text x="142" y="378" class="learn-note">feeds the next editorial cycle</text>

  <rect x="20" y="700" width="1160" height="40" rx="8" class="neutral"/>
  <text x="40" y="724" class="loop">MAINTENANCE · NOT A RUNTIME LOOP · external taxonomy → review → human-corpus regression → tests → versioned release</text>
</svg>
