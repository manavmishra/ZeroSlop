<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" role="img" aria-label="A Zero Slop terminal demonstration. A generic marketing sentence receives a writing score of 100 and four phrases are flagged. The rewritten sentence, We cut onboarding setup time by 40 percent using AI, receives a writing score of 9.5 with no flagged phrases.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101720"/>
      <stop offset="1" stop-color="#080c12"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
      .cmd { font-size:24px; fill:#D7DEE8 }
      .muted { font-size:22px; fill:#8A97A8 }
      .body { font-size:22px; fill:#B9C4D1 }
      .green { fill:#4FD18B }
      .blue { fill:#64A9FF }
      .red { fill:#FF6474 }
      .amber { fill:#FFBE4F }
    </style>
  </defs>

  <rect width="1500" height="800" fill="#070A0E" class="grp"/>
  <rect x="30" y="26" width="1440" height="748" rx="20" fill="url(#bg)" stroke="#243140" filter="url(#shadow)" class="grp"/>
  <rect x="30" y="26" width="1440" height="54" rx="20" fill="#18212C" class="grp"/>
  <rect x="30" y="60" width="1440" height="20" fill="#18212C" class="grp"/>
  <circle cx="62" cy="53" r="8" fill="#FF605C"/>
  <circle cx="88" cy="53" r="8" fill="#FFBD44"/>
  <circle cx="114" cy="53" r="8" fill="#00CA4E"/>
  <text x="750" y="60" text-anchor="middle" class="mono muted">zero-slop · before / after</text>

  <text x="60" y="122" class="mono cmd"><tspan class="green">$</tspan><tspan> slopscore draft.md </tspan><tspan class="blue">--explain</tspan></text>
  <text x="74" y="164" class="mono body">“We’re thrilled to announce that our team has leveraged cutting-edge AI</text>
  <text x="74" y="196" class="mono body">to deliver a seamless onboarding experience, cutting setup time by 40%.”</text>

  <text x="60" y="244" class="mono cmd">Writing score: <tspan class="red">100.0</tspan>/100  <tspan class="red">[major rewrite]</tspan></text>
  <text x="74" y="278" class="mono muted">Flagged phrases (4), strongest first:</text>
  <text x="88" y="326" class="mono body"><tspan class="amber">“We’re thrilled to”</tspan> — canned announcement opening</text>
  <text x="88" y="370" class="mono body"><tspan class="amber">“cutting-edge”</tspan> — hype without a concrete claim</text>
  <text x="88" y="414" class="mono body"><tspan class="amber">“seamless”</tspan> — vague praise</text>
  <text x="88" y="458" class="mono body"><tspan class="amber">“leveraged”</tspan> — a simpler verb would be clearer</text>

  <line x1="60" y1="524" x2="1440" y2="524" stroke="#273443"/>

  <text x="60" y="570" class="mono cmd"><tspan class="green">$</tspan><tspan> slopscore rewrite.md </tspan><tspan class="blue">--explain</tspan></text>
  <text x="74" y="612" class="mono body">“We cut onboarding setup time by 40% using AI.”</text>
  <text x="60" y="660" class="mono cmd">Writing score: <tspan class="green">9.5</tspan>/100  <tspan class="green">[clear]</tspan></text>
  <text x="74" y="698" class="mono muted">Flagged phrases: <tspan class="green">none</tspan> · only sentence rhythm and formatting remain</text>
</svg>
