# The wheel ships the same scorer bytes as the skill and the hosted Worker.
# packaging/zero_slop is generated by scripts/build_pypi.py and verified in CI;
# do not edit it by hand.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-slop"
version = "2.10.2"
description = "Score AI-sounding prose 0-100 and check what a rewrite changed. Offline, standard library only."
readme = "README-pypi.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manav Mishra", email = "manavm@gmail.com" }]
keywords = [
    "prose", "linter", "writing", "editing", "ai-slop", "de-slop",
    "humanize", "style", "ci", "static-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://zero-slop.ai"
Source = "https://github.com/manavmishra/ZeroSlop"
Changelog = "https://github.com/manavmishra/ZeroSlop/releases"
Issues = "https://github.com/manavmishra/ZeroSlop/issues"

[project.scripts]
slopscore = "zero_slop.scripts.slopscore:main"
zero-slop-score = "zero_slop.scripts.slopscore:main"
zero-slop-gate = "zero_slop.scripts.gate:main"

[tool.setuptools]
package-dir = { "" = "packaging" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["packaging"]
include = ["zero_slop*"]

[tool.setuptools.package-data]
zero_slop = ["data/*.json"]
