name: Publish MCP registry metadata

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: publish-mcp-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install the pinned MCP publisher
        env:
          PUBLISHER_VERSION: "1.8.1"
          PUBLISHER_ASSET: "mcp-publisher_linux_amd64.tar.gz"
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz "${base}/${PUBLISHER_ASSET}"
          curl --fail --location --silent --show-error \
            --output checksums.txt "${base}/registry_${PUBLISHER_VERSION}_checksums.txt"
          grep " ${PUBLISHER_ASSET}$" checksums.txt | sed "s/${PUBLISHER_ASSET}/mcp-publisher.tar.gz/" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish remote server metadata
        run: ./mcp-publisher publish

      - name: Confirm the registry serves this version
        run: |
          set -euo pipefail
          expected=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          for attempt in $(seq 1 12); do
            # Read the named latest record, never the first historical search
            # result. A temporary HTTP/metadata failure retries but cannot pass.
            current=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              'https://registry.modelcontextprotocol.io/v0.1/servers/io.github.manavmishra%2Fzero-slop/versions/latest' \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("server", {}); m=d.get("_meta", {}).get("io.modelcontextprotocol.registry/official", {}); assert s.get("name")=="io.github.manavmishra/zero-slop" and isinstance(s.get("version"), str) and s["version"] and m.get("status")=="active" and m.get("isLatest") is True; print(s["version"])') || current=""
            if [ "$current" = "$expected" ]; then
              echo "MCP Registry now serves Zero Slop $current"
              exit 0
            fi
            echo "attempt $attempt/12: MCP Registry serves ${current:-nothing}, waiting for $expected"
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::MCP Registry did not converge to $expected"
          exit 1
