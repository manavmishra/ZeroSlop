name: release on tag

# A release created with GITHUB_TOKEN does not trigger another workflow. Build
# and attach the installer here instead of expecting release-assets.yml to wake
# up. Reruns repair an existing release, so a partial publication is recoverable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Require the exact validated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/publication_guard.py --tag "$RELEASE_TAG" --sha "$(git rev-parse HEAD)"
      - name: test the tagged tree before publication
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/calibrate.py --selftest
          python3 scripts/register.py --selftest
      - name: build the tagged installer
        run: |
          python3 scripts/build_plugin.py --check
          python3 scripts/build_bundle.py --check
          python3 scripts/build_skill_zip.py
      - name: create or repair the release and its assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publication_guard.py --tag "$TAG" --sha "$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/zero-slop.zip dist/zero-slop-single-file.md \
              assets/Zero-Slop-One-Pager.pdf --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest --verify-tag
          else
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
            if [ -z "$NOTES" ]; then
              NOTES="Zero Slop $TAG. See the commit history for what changed."
            fi
            gh release create "$TAG" --latest --title "Zero Slop $TAG" \
              --notes "$NOTES" \
              dist/zero-slop.zip dist/zero-slop-single-file.md \
              assets/Zero-Slop-One-Pager.pdf
          fi

          # --latest is a request, not a guarantee: a release already carrying
          # the flag can keep it, and the mismatch then sits until the hourly
          # reconcile notices. Assert it took, and repair once before failing,
          # so the flag can never disagree with the version being released.
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ "$latest" != "$TAG" ]; then
            echo "latest points at '${latest:-none}', not $TAG; repairing"
            gh release edit "$TAG" --latest --verify-tag
            latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          fi
          if [ "$latest" != "$TAG" ]; then
            echo "::error::the latest release flag is '${latest:-none}', not $TAG." >&2
            exit 1
          fi
          echo "latest release flag confirmed at $TAG"
  deploy_mcp:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-mcp.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_sha: ${{ github.sha }}
    secrets:
      CF_WORKERS_DEPLOY_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  website_sync:
    needs: [publish, deploy_mcp]
    if: needs.deploy_mcp.outputs.status == 'deployed'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Wait for npm before waking the release-pinned website
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          for attempt in $(seq 1 15); do
            current=$(curl --fail --silent --show-error --max-time 10 https://registry.npmjs.org/zero-slop/latest | jq -r .version) || current=""
            if [ "$current" = "$expected" ]; then exit 0; fi
            sleep 10
          done
          echo '::error::npm has not converged; the website stays pinned to its last verified release'
          exit 1
      - name: Wake the website sync after npm and hosted runtime readiness
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_SYNC_TOKEN is not configured; the hourly reconciliation remains active"
          else
            gh api --method POST repos/manavmishra/ZSWebpage/dispatches \
              -f event_type=zero-slop-release
          fi

  public_surfaces:
    needs: [publish, deploy_mcp, website_sync]
    if: needs.deploy_mcp.outputs.status == 'deployed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Skip verification of a superseded release
        id: latest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: timeout 90s python3 .github/scripts/deploy_mcp.py guard --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Wait for public release surfaces to converge
        if: steps.latest.outputs.status == 'current'
        env:
          WEBSITE_SYNC_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
        run: |
          args=(--require-network --wait-seconds 600 --skip-homebrew)
          echo "Homebrew convergence is checked by its hourly tested sync and the complete release audit."
          if [ -z "$WEBSITE_SYNC_TOKEN" ]; then
            echo "::warning::Website verification is owned by its hourly sync until WEBSITE_SYNC_TOKEN is configured"
            args+=(--skip-website)
          fi
          timeout 840s python3 scripts/check_release_surfaces.py "${args[@]}"
