name: REST language examples

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZERO_SLOP_REQUIRE_ALL_EXAMPLES: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Compile Java with its JSON dependency
        run: mvn --batch-mode --no-transfer-progress -f integrations/api-examples/java/pom.xml compile dependency:copy-dependencies
      - name: Compile C# with the standard library
        run: dotnet build integrations/api-examples/csharp/Deslop.csproj --output "${{ runner.temp }}/zero-slop-csharp"
      - name: Compile Rust with its HTTP and JSON dependencies
        run: cargo build --manifest-path integrations/api-examples/rust/Cargo.toml --target-dir "${{ runner.temp }}/zero-slop-rust"
      - name: Exercise all eight languages against a local HTTP server
        # Fixed synthetic data only. No credentials, remote drafts, or model calls.
        # Missing compilers fail this job rather than silently skipping a language.
        env:
          ZERO_SLOP_JAVA_CP: ${{ github.workspace }}/integrations/api-examples/java/target/classes:${{ github.workspace }}/integrations/api-examples/java/target/dependency/*
          ZERO_SLOP_CSHARP_DLL: ${{ runner.temp }}/zero-slop-csharp/Deslop.dll
          ZERO_SLOP_RUST_EXAMPLE: ${{ runner.temp }}/zero-slop-rust/debug/zero-slop-rest-example
        run: node --test integrations/api-examples/samples.test.mjs
