name: synchronize release

# The validation workflow calls this reusable workflow only after its code,
# website, and MCP jobs pass on main. GitHub suppresses workflow triggers caused
# by GITHUB_TOKEN, so this job creates the tag and dispatches the two tag-owned
# publication workflows explicitly.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

concurrency:
  group: synchronize-release
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Never turn event metadata into an executable checkout ref. The
          # caller admits only a successful push to trusted main.
          ref: refs/heads/main
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Confirm the validated commit is still main
        id: head
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          checked=$(git rev-parse HEAD)
          if [ "$current" != "$checked" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "main advanced from $checked to $current; the newer validation run owns publication"
          elif [ "$VALIDATED_SHA" != "$checked" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "the successful validation covered $VALIDATED_SHA, not trusted main $checked"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm every package names the same version
        if: steps.head.outputs.publish == 'true'
        run: python3 scripts/check_distribution_manifests.py

      - name: Create the immutable version tag
        if: steps.head.outputs.publish == 'true'
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          tag="v$version"
          remote=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -n "$remote" ]; then
            echo "$tag already exists; this commit does not create another release"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch the release and MCP Registry publishers
        if: steps.head.outputs.publish == 'true' && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          gh workflow run release-on-tag.yml --ref "$TAG"
          gh workflow run publish-mcp.yml --ref "$TAG"
          echo "dispatched GitHub release and MCP Registry publication for $TAG"
